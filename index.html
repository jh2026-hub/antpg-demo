<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘 장 어땠어?</title>
<meta name="description" content="오늘 장 어땠는지 한 번 누르고, 한 줄 남기고, 서로 토닥이는 곳">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫠</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--soft:#f1eee7;--line:#e7e2d8;--text:#1f2126;--muted:#868a93;--up:#f04452;--down:#3182f6;--accent:#ff8a3d;--accent-soft:#fff1e6;--shadow:0 2px 10px rgba(30,25,15,.06);--r:18px}
@media (prefers-color-scheme: dark){:root{--bg:#14161b;--card:#1d2027;--soft:#252932;--line:#2e333d;--text:#eceef2;--muted:#8e95a2;--accent-soft:#3a2a1c;--shadow:0 2px 10px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}.s{font-size:12.5px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:12px 16px 10px;background:var(--bg)}
.logo{font-size:20px;font-weight:900;letter-spacing:-.5px}
.me{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.h2{font-size:17px;font-weight:800;margin:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 6px}
.sec h3{font-size:16px;margin:0}
.strip{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tk{flex:none;padding:8px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:13px;line-height:1.25;text-align:left}
.tk b{display:block;font-size:12.5px}.tk.on{outline:2px solid var(--accent)}
.moodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;background:var(--soft);font-weight:700;font-size:13.5px;transition:transform .12s}
.mb span{font-size:30px;line-height:1.1}.mb:active{transform:scale(.94)}.mb.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.dist{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft);margin:10px 0 8px}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.post{background:var(--card);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:var(--shadow);display:block}
.post .hd{display:flex;align-items:center;gap:10px}
.post .em{font-size:30px;line-height:1;flex:none}
.post .who{font-size:13px;color:var(--muted);min-width:0}
.post .who b{color:var(--text)}
.post .body{margin:8px 0 2px;white-space:pre-wrap;font-size:15.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--text);margin-left:4px;vertical-align:1px}
.botb{font-size:10.5px;padding:0 6px;border-radius:999px;background:#e7efff;color:#3b6fd8;margin-left:4px;vertical-align:1px}
@media (prefers-color-scheme: dark){.botb{background:#21324f;color:#9cc2ff}}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rb{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;transition:transform .12s;position:relative}
.rb:active{transform:scale(.92)}.rb.on{background:var(--accent-soft);color:var(--accent)}
.rb .pop{position:absolute;left:50%;top:-4px;pointer-events:none;font-size:20px;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(-50%,-40px) scale(1.3);opacity:0}}
.cnt{margin-left:auto;font-size:13px;color:var(--muted);align-self:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--soft);font-weight:700}
.btn.pri{background:var(--accent);color:#fff}.btn.full{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;outline:none}
.f:focus{border-color:var(--accent)}
textarea.f{min-height:90px;resize:none}
.opbtn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.ob{padding:12px 4px;border-radius:14px;background:var(--soft);font-weight:700;font-size:14px}
.ob.on{outline:2px solid var(--accent);background:var(--accent-soft)}
.obar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:12px 0 6px;background:var(--soft)}
.obar i{display:block;height:100%;transition:width .6s}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .2s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tabbar a{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);font-weight:600}
.tabbar a span{font-size:21px;line-height:1.2}.tabbar a.on{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:28px 0;font-size:14px}
.cm{padding:12px 0;border-top:1px solid var(--line)}
.cm .who{font-size:12.5px;color:var(--muted)}.cm .who b{color:var(--text)}
.cm.new{animation:flash 1.4s}@keyframes flash{from{background:var(--accent-soft)}}
.care{background:var(--accent-soft);border-radius:14px;padding:14px;margin-top:12px;font-size:14px}
.foot{margin:28px 0 8px;text-align:center;font-size:12px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#2fbf71;animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.3}}
.bagstage{position:relative;height:200px;display:flex;justify-content:center;align-items:flex-start;margin-top:10px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bag{position:relative;transform-origin:50% 0}.bag canvas{display:block;width:96px;height:152px;image-rendering:pixelated}
.bag.hl{animation:sl .5s cubic-bezier(.2,1.6,.4,1)}.bag.hr{animation:sr .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes sl{30%{transform:rotate(-16deg)}100%{transform:none}}@keyframes sr{30%{transform:rotate(16deg)}100%{transform:none}}
.baglbl{position:absolute;left:0;right:0;top:62px;text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none}
.pow{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:22px;color:var(--accent);pointer-events:none;animation:pw .7s ease-out forwards}
@keyframes pw{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-150%) scale(1.1);opacity:0}}
.big{font-size:26px;font-weight:900}
.exbox{margin-top:12px;padding:16px;border-radius:14px;background:var(--soft);min-height:100px}
.exbox.roll{animation:roll .4s cubic-bezier(.2,1.5,.4,1)}@keyframes roll{from{transform:rotateX(70deg);opacity:0}}
.exmain{font-size:18px;font-weight:900;margin:6px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="app"><div class="empty">불러오는 중…</div></main></div>
<nav class="tabbar"><div class="in">
  <a href="#/" data-tab="home"><span>🏠</span>오늘</a>
  <a href="#/play" data-tab="play"><span>🥊</span>기분 풀기</a>
  <a href="#/me" data-tab="me"><span>🙂</span>나</a>
</div></nav>
<script>
'use strict';
/* ---------------------------------------------------------------- setup */
const CFG = window.MW_CONFIG || {};
const sb = supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
const MOODS = [
  {k:'rekt',   e:'😭', n:'털렸다',   ph:'어디서 털렸는지 한 줄만…', c:'#3182f6'},
  {k:'empty',  e:'😮‍💨', n:'허탈하다', ph:'허탈한 이유 한 줄…',       c:'#7a8ca6'},
  {k:'unfair', e:'😤', n:'억울하다', ph:'뭐가 제일 억울해요?',       c:'#a46ad8'},
  {k:'meh',    e:'😐', n:'그냥저냥', ph:'오늘은 그냥 그랬다…',       c:'#b8b2a6'},
  {k:'held',   e:'😌', n:'버텼다',   ph:'버틴 비결 한 줄…',          c:'#2fbf71'},
  {k:'won',    e:'🥳', n:'벌었다',   ph:'자랑 한 줄 (적당히…)',      c:'#f04452'},
];
const MOOD = Object.fromEntries(MOODS.map(m => [m.k, m]));
const RX = [['hug','🫂','토닥'], ['metoo','🙋','나도'], ['cheer','💪','힘내'], ['lol','🤣','ㅋㅋ']];
const SUMMARY = {rekt:'오늘은 다 같이 털린 날이에요 🫠', empty:'다들 멍하니 차트만 보는 중', unfair:'억울한 사람이 제일 많아요. 시장이 사과해야 함',
  meh:'대체로 무덤덤. 평화로운 하루', held:'버틴 사람이 제일 많아요. 오늘의 승자들', won:'벌었다는 사람이 제일 많아요. 배 아픈 날'};
const CRISIS = /죽고\s*싶|자살|극단적\s*선택|사라지고\s*싶|살기\s*싫|다\s*끝내고\s*싶/;
const ADJ = ['졸린','배고픈','존버하는','물린','신난','침착한','성급한','눈치빠른','겁없는','흔들리는','든든한','날쌘','멍한','씩씩한'];
const NOUN = ['개미','고래','다람쥐','펭귄','토끼','부엉이','감자','고양이','수달','햄스터','오리','곰돌이'];

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const T = s => new Date(s).getTime();
const pick = a => a[Math.floor(Math.random() * a.length)];
const randName = () => pick(ADJ) + pick(NOUN) + (10 + Math.random() * 90 | 0);
const kstDay = () => new Date(now() + 9 * 3600e3).toISOString().slice(0, 10);
function ago(t){ const s = (now() - T(t)) / 1000; if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; return Math.floor(s / 86400) + '일 전'; }
function toast(m){ $('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const errMsg = e => (e && (e.message || e.error_description)) || '잠시 후 다시 해 주세요';
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
function modal(html){ closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="sheet">${html}</div>`; m.addEventListener('click', e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal(){ $$('.modal').forEach(m => m.remove()); }
const isTyping = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName); };

/* ---------------------------------------------------------------- market context */
const A = {}; let ASSETS = [];
const ICON = {BTCUSDT:'₿', ETHUSDT:'Ξ', SPX:'🇺🇸', NVDA:'🟩', TSLA:'🚗', KOSPI:'🇰🇷', '005930':'📱', '000660':'💾'};
const pct = a => +(a.change_pct || 0);
const fmtC = a => (pct(a) > 0 ? '+' : '') + pct(a).toFixed(2) + '%';
const dir = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
async function loadAssets(){
  const { data } = await sb.from('assets').select('symbol,name,short,kind,change_pct,price').eq('active', true).order('sort');
  ASSETS = (data || []).map(r => Object.assign(A[r.symbol] = A[r.symbol] || {}, r));
}

/* ---------------------------------------------------------------- me (no signup: first action creates a random name) */
let ME = null, LAST = null, BUSY = false;
async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession(); if (!session) return;
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle(); ME = data || null;
}
function need(){ if (ME) return true; autoJoin(LAST); return false; }
async function autoJoin(then){
  if (BUSY) return; BUSY = true;
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session){ const { error } = await sb.auth.signInAnonymously(); if (error) throw error; }
    for (let i = 0; i < 4 && !ME; i++){ try { ME = await rpc('set_nickname', {nick: randName()}); } catch(e){ if (!/이미 있는/.test(errMsg(e))) throw e; } }
    if (!ME) throw new Error('잠시 후 다시 눌러 주세요');
    toast(`'${ME.nickname}'(으)로 남겨요 · 이름은 '나' 탭에서 바꿀 수 있어요`);
    if (then) await then();
  } catch(e){ toast(errMsg(e)); } finally { BUSY = false; }
}

/* ---------------------------------------------------------------- shared bits */
const UI = {filter:null, limit:30, opSym:null, excuse:null, cm:null};
const BOT = '<span class="botb">봇</span>';
const header = () => `<header class="top row sb"><div><div class="logo">오늘 장 어땠어? 🫠</div><div class="live"><span class="dot"></span><span id="viewers">${VIEWERS}명 보는 중</span></div></div>${ME ? `<a class="me" href="#/me">${esc(ME.nickname)}</a>` : ''}</header>`;
const foot = () => `<div class="foot">재미로 나누는 곳이에요. 투자 권유가 아니에요 · 시세는 늦을 수 있어요</div>`;
function strip(){
  return `<div class="strip">${ASSETS.map(a => `<button class="tk ${UI.opSym === a.symbol ? 'on' : ''}" data-act="opsym" data-v="${esc(a.symbol)}">${ICON[a.symbol] || '📈'} <b>${esc(a.short)}</b><span class="num ${dir(pct(a))}" data-c="${esc(a.symbol)}">${fmtC(a)}</span></button>`).join('')}</div>`;
}
function moodCard(m, my){
  const md = MOOD[m.mood] || MOOD.meh, au = m.author || {}, a = m.symbol && A[m.symbol];
  return `<a class="post" href="#/m/${m.id}" data-mid="${m.id}"><div class="hd"><div class="em">${md.e}</div>
    <div class="who"><b>${esc(au.nickname || '누군가')}</b>${au.is_bot ? BOT : ''} · ${md.n}${a ? `<span class="tag">${esc(a.short)} <span class="${dir(pct(a))}">${fmtC(a)}</span></span>` : ''}<div class="s">${ago(m.created_at)}</div></div></div>
    ${m.body ? `<div class="body">${esc(m.body)}</div>` : ''}
    <div class="rx">${RX.map(([k, e, n]) => `<button class="rb ${my && my.has(m.id + k) ? 'on' : ''}" data-act="rx" data-id="${m.id}" data-k="${k}">${e} ${n} <b class="num">${m[k] || ''}</b></button>`).join('')}<span class="cnt">💬 ${m.comment_count}</span></div></a>`;
}
async function myReactions(ids){
  if (!ME || !ids.length) return new Set();
  const { data } = await sb.from('mood_reactions').select('mood_id,kind').in('mood_id', ids).eq('user_id', ME.id);
  return new Set((data || []).map(r => r.mood_id + r.kind));
}
const MOODSEL = 'id,mood,symbol,body,hug,metoo,cheer,lol,comment_count,created_at,author:profiles!moods_author_id_fkey(nickname,is_bot)';

/* ---------------------------------------------------------------- home */
let TODAY = {};
function distHTML(){
  const tot = MOODS.reduce((s, m) => s + (TODAY[m.k] || 0), 0);
  const top = MOODS.slice().sort((a, b) => (TODAY[b.k] || 0) - (TODAY[a.k] || 0))[0];
  return `<div class="card" id="dist"><div class="row sb"><h2 class="h2">오늘 모두의 기분</h2><span class="muted s num">${tot}명</span></div>
    <div class="muted" style="margin-top:4px">${tot ? SUMMARY[top.k] : '아직 아무도 안 남겼어요. 첫 번째가 되어 주세요'}</div>
    <div class="dist">${tot ? MOODS.map(m => `<i style="width:${(TODAY[m.k] || 0) / tot * 100}%;background:${m.c}"></i>`).join('') : ''}</div>
    <div class="legend">${MOODS.map(m => `<span>${m.e} <b>${tot ? Math.round((TODAY[m.k] || 0) / tot * 100) : 0}%</b></span>`).join('')}</div></div>`;
}
async function opinionHTML(){
  const a = A[UI.opSym]; if (!a) return '';
  const o = await rpc('opinion_today', {p_symbol: a.symbol}).catch(() => ({up:0, down:0, dunno:0}));
  const t = o.up + o.down + o.dunno, w = k => t ? o[k] / t * 100 : 0;
  const q = pct(a) <= -3 ? `${a.name} ${fmtC(a)}… 여기서 어떨 것 같아요?` : pct(a) >= 3 ? `${a.name} ${fmtC(a)}! 더 갈까요?` : `${a.name}, 앞으로 어떨 것 같아요?`;
  return `<div class="card" id="op"><div class="row sb"><h2 class="h2">💬 다들 어떻게 생각해?</h2><span class="muted s">맞히기 아님 · 생각만</span></div>
    <div style="margin-top:6px;font-weight:700">${esc(q)}</div>
    <div class="opbtn">${[['up','📈 오를 것'],['down','📉 내릴 것'],['dunno','🤷 모르겠다']].map(([k, n]) => `<button class="ob ${o.mine === k ? 'on' : ''}" data-act="op" data-v="${k}">${n}</button>`).join('')}</div>
    ${t ? `<div class="obar"><i style="width:${w('up')}%;background:var(--up)"></i><i style="width:${w('dunno')}%;background:var(--line)"></i><i style="width:${w('down')}%;background:var(--down)"></i></div>

function bagDraw(){
  const cv = $('#bagc'); if (!cv) return; const g = cv.getContext('2d'), P = 4, n = BAG.server + BAG.pending;
  g.clearRect(0, 0, 96, 152); g.fillStyle = '#9aa0aa'; for (let y = 0; y < 6; y++) g.fillRect(44, y * P, 8, P);
  for (let y = 6; y < 37; y++) for (let x = 2; x < 22; x++){ if ((y === 6 || y === 36) && (x < 5 || x > 18)) continue;
    g.fillStyle = y < 9 ? '#3a3f47' : x < 5 ? '#c24a2c' : x > 18 ? '#a63c22' : (x + y) % 7 === 0 ? '#e0633f' : '#ee7048'; g.fillRect(x * P, y * P, P, P); }
  const k = n >= 50000 ? 5 : n >= 10000 ? 4 : n >= 3000 ? 3 : n >= 1000 ? 2 : n >= 100 ? 1 : 0, sp = [[6,13],[15,20],[7,27],[14,31],[10,17]];
  for (let i = 0; i < k; i++){ const [x, y] = sp[i]; for (let j = 0; j < 4; j++){ g.fillStyle = '#f6e3c2'; g.fillRect((x + j) * P, (y + j) * P, P, P); g.fillRect((x + 3 - j) * P, (y + j) * P, P, P); } }
  const a = $('#bagn'); if (a) a.textContent = n.toLocaleString('ko-KR') + '대'; const c = $('#bagc2'); if (c) c.textContent = 'x' + BAG.combo;

  sb.channel('assets').on('postgres_changes', {event:'UPDATE', schema:'public', table:'assets'}, ({ new: r }) => {
    const a = A[r.symbol]; if (!a) return; a.change_pct = r.change_pct; a.price = r.price;
    $$(`[data-c="${CSS.escape(r.symbol)}"]`).forEach(el => { el.textContent = fmtC(a); el.className = 'num ' + dir(pct(a)); });
  }).subscribe();
  sb.channel('moods').on('postgres_changes', {event:'INSERT', schema:'public', table:'moods'}, async ({ new: m }) => {
    if (location.hash && location.hash !== '#/') return;
    const { data:au } = await sb.from('profiles').select('nickname,is_bot').eq('id', m.author_id).maybeSingle();
    if (!au?.is_bot){ TODAY[m.mood] = (TODAY[m.mood] || 0) + 1; const d = $('#dist'); if (d) d.outerHTML = distHTML(); }
    if (UI.filter && UI.filter !== m.mood) return;
    const feed = $('#feed'); if (!feed || $(`[data-mid="${m.id}"]`)) return;
    feed.querySelector('.empty')?.remove(); feed.insertAdjacentHTML('afterbegin', moodCard({...m, author: au}, null));
  }).subscribe();
  const lobby = sb.channel('lobby', { config: { presence: { key: Math.random().toString(36).slice(2) } } });
  lobby.on('presence', { event: 'sync' }, () => { VIEWERS = Math.max(1, Object.keys(lobby.presenceState()).length); const v = $('#viewers'); if (v) v.textContent = `${VIEWERS}명 보는 중`; })
       .subscribe(async st => { if (st === 'SUBSCRIBED') await lobby.track({ at: Date.now() }); });
  setInterval(() => { if (!isTyping() && !$('.modal') && now() - BAG.at > 8000) loadAssets().then(() => { if (!location.hash || location.hash === '#/') render(true); }); }, 60000);
})();
</script>
</body>
</html>
