<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 전황</title>
<meta name="description" content="시세가 곧 전황이다. 주식·코인·채권·환율 영토에서 상승군과 하락군이 싸우는 전쟁 놀이">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0f17'/><path d='M3 2h1v13H3zM4 3h9l-2 3 2 3H4z' fill='%23f04452'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#0b0f17;--card:#141a24;--card2:#1b2230;--line:#273042;--text:#e8ebf1;--muted:#8792a6;--up:#f04452;--down:#3b82f6;--gold:#f5c542;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.px{image-rendering:pixelated}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(118px + env(safe-area-inset-bottom))}
.pix{font-family:'Galmuri11','Galmuri9',monospace;letter-spacing:-.2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.muted{color:var(--muted)}.s{font-size:12.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.wrapf{flex-wrap:wrap}
.top{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;height:56px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.logo{font-size:19px;color:var(--gold);flex:1}
.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;white-space:nowrap;max-width:150px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.h{font-size:15px;margin:0}
.sec{font-size:15px;margin:22px 0 4px;display:flex;align-items:baseline;gap:8px}
.sec .more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0e131c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tabbar a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.tabbar a.on{color:var(--gold)}
.tabbar .ic{font-size:20px;line-height:1.25}
.btn{min-height:44px;padding:0 16px;border-radius:12px;white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--gold);color:#1d1600;border-color:transparent}
.btn.bu{background:var(--up);color:#fff;border-color:transparent}
.btn.bd{background:var(--down);color:#fff;border-color:transparent}
.btn.full{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{width:100%;min-height:44px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.f:focus{border-color:var(--gold)}
textarea.f{min-height:110px;resize:vertical}
label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.seg button.on.U{background:var(--up);color:#fff}.seg button.on.D{background:var(--down);color:#fff}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--card2);margin:8px 0 6px}
.bar i{display:block;height:100%;transition:width .8s}
.bar .bu{background:var(--up)}.bar .bd{background:var(--down)}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}
.disc{margin:28px 0 8px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#f3f4f6;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.flag{width:24px;height:24px;border-radius:5px;background:var(--card2);flex:none;vertical-align:middle}
.flag.lg{width:72px;height:72px;border-radius:12px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--card2);color:var(--muted);white-space:nowrap}
.tag.live{color:#4ade80}
.rank{font-size:11px;border:1px solid #6b5a1e;color:var(--gold);border-radius:6px;padding:0 5px;white-space:nowrap}
/* world map */
.mapwrap{margin:12px -16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d1f37;overflow:hidden}
.map{position:relative;width:100%;aspect-ratio:100/124}
#mapc{position:absolute;left:0;top:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;padding:2px 6px;min-width:44px;border-radius:7px;background:rgba(8,12,20,.86);border:1px solid rgba(255,255,255,.14);border-top:3px solid #8a8f99;font-size:10.5px;line-height:1.25;white-space:nowrap;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pin b{font-weight:700}
.pin span{font-size:10px}
.pin.hot{animation:pinpulse .9s ease-in-out infinite alternate}
@keyframes pinpulse{to{box-shadow:0 0 0 3px rgba(245,197,66,.4)}}
.sky{position:absolute;z-index:2;transform:translate(-50%,-50%);animation:float 3.2s ease-in-out infinite}
.sky.b{animation-delay:-1.6s}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 5px))}}
.boom{position:absolute;z-index:4;pointer-events:none;font-size:15px;transform:translate(-50%,-50%);animation:boom .9s ease-out forwards}
@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1.5)}}
.maplbl{position:absolute;z-index:1;font-family:'Galmuri11',monospace;font-size:10.5px;color:rgba(255,255,255,.5);letter-spacing:2px;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
/* fronts */
.flist a{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.flist .nm{font-weight:700;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist .pr{text-align:right;font-size:13px}
.ctl{width:56px;height:8px;border-radius:999px;overflow:hidden;background:var(--down);flex:none}
.ctl i{display:block;height:100%;background:var(--up);transition:width .8s}
.band{position:sticky;top:56px;z-index:15;margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.bp{font-size:24px;font-weight:800;line-height:1.2}
.bc{font-size:16px;font-weight:700;text-align:right}
.field{position:relative;margin:0 -16px}
#bf{display:block;width:100%;height:170px}
.fl{position:absolute;top:8px;font-family:'Galmuri11',monospace;font-size:12px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.45)}
.fl.l{left:12px;color:#ffb3bb}.fl.r{right:12px;color:#a9c8ff}
.state{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:'Galmuri11',monospace;font-size:13px;padding:3px 10px;border-radius:8px;background:rgba(0,0,0,.6);white-space:nowrap}
/* flows */
.flow{display:grid;grid-template-columns:92px 1fr 64px;gap:6px;align-items:center;margin:6px 0;font-size:13px}
.flow .track{position:relative;height:16px;background:var(--card2);border-radius:4px;overflow:hidden}
.flow .track:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.flow .track i{position:absolute;top:2px;bottom:2px;border-radius:3px}
.flow .v{text-align:right}
.hours{display:flex;gap:2px;height:64px;margin-top:8px;position:relative}
.hours:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.hours span{flex:1;position:relative}
.hours span i{position:absolute;left:0;right:0;border-radius:2px}
/* posts */
.post{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
.post .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.post .t{font-weight:700;margin:4px 0 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post .foot{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ftag{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--text)}
.side{font-family:'Galmuri11',monospace;font-size:11px;font-weight:700;border:2px solid;border-radius:6px;padding:0 5px;display:inline-block;line-height:1.5;transform:rotate(-4deg)}
.side.UP{color:var(--up)}.side.DOWN{color:var(--down)}
.res{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--card2);white-space:nowrap}
.res.WIN{color:#4ade80}.res.LOSE{color:#fca5a5}
.rxbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.rx{position:relative;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);display:inline-flex;gap:6px;align-items:center;font-size:14px}
.rx.on{border-color:var(--gold);background:#2a2412}
.pop{position:absolute;left:50%;top:0;pointer-events:none;font-size:22px;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(-50%,-56px) scale(1.4);opacity:0}}
.body{white-space:pre-wrap;margin:12px 0}
.body a{color:#7cc4ff;text-decoration:underline}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm.new{animation:flash 1.5s}
@keyframes flash{0%{background:#2a2412}100%{background:transparent}}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(100px + env(safe-area-inset-bottom));z-index:25;height:52px;padding:0 20px;border-radius:999px;background:var(--gold);color:#1d1600;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.45);display:flex;align-items:center}
.sortt{display:flex;gap:6px;margin:16px 0 0;align-items:center}
.sortt button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.sortt button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pool{display:flex;height:30px;border-radius:10px;overflow:hidden;margin:10px 0 4px;font-size:12px;font-weight:700}
.pool div{display:flex;align-items:center;padding:0 8px;min-width:0;white-space:nowrap;overflow:hidden}
.pool .pa{background:#3a1d22;color:#ffb3bb}.pool .pb{background:#16233d;color:#a9c8ff;justify-content:flex-end}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t .r{text-align:right}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.pal button{aspect-ratio:1;min-height:36px;border-radius:8px;border:2px solid transparent}
.pal button.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools .btn.on{border-color:var(--gold);color:var(--gold)}
#pxc,#mmc{width:100%;max-width:400px;aspect-ratio:1;display:block;margin:10px auto;border-radius:10px;border:1px solid var(--line)}
#pxc{touch-action:none}
.artg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.art img{width:100%;aspect-ratio:1;display:block;background:repeating-conic-gradient(#1a2130 0 25%,#212a3a 0 50%) 0 0/16px 16px;border-radius:8px}
.art .an{font-size:12.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tpls button{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px}
.tpls button.on{border-color:var(--gold);color:var(--gold)}
.memeimg{width:100%;border-radius:12px;margin:8px 0;display:block}
.pollo{position:relative;display:block;width:100%;text-align:left;min-height:44px;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);overflow:hidden}
.pollo .fill{position:absolute;left:0;top:0;bottom:0;background:#2e2814}
.pollo span{position:relative}
.pollo.mine{border-color:var(--gold)}
.note{background:#231f10;border:1px solid #4a3f12;color:#f3df8a;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:10px 0}
.skel{height:80px;border-radius:12px;background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin:12px 0}
@keyframes sk{to{background-position:-200% 0}}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:10px}
.summary>*{background:var(--card2);border-radius:10px;padding:8px 4px;display:block}
.summary b{display:block;font-size:22px;font-family:'Galmuri11',monospace}
.cats{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;white-space:nowrap}
.cats button.on{background:var(--gold);color:#1d1600;border-color:var(--gold);font-weight:700}
.cat{font-size:11.5px;border-radius:6px;padding:0 6px;background:#262d3b;color:var(--text);white-space:nowrap}
.candles{font-size:22px;letter-spacing:-6px;margin:10px 0 4px;min-height:26px;line-height:1.2;overflow-wrap:anywhere}
.candles i{display:inline-block;font-style:normal;animation:flick 1.1s ease-in-out infinite alternate}
.candles i:nth-child(3n){animation-delay:-.4s}.candles i:nth-child(3n+1){animation-delay:-.8s}
@keyframes flick{to{transform:translateY(-2px) scale(1.06);opacity:.8}}
.bigrx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.bigrx .rx{justify-content:center;min-height:50px;font-size:15px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score b{font-family:'Galmuri11',monospace;font-size:32px;display:block;line-height:1.1}
.lb td{vertical-align:middle}
.botb{font-size:10.5px;padding:0 5px;border-radius:5px;background:#1d2a3f;color:#9cc2ff;border:1px solid #2c4366;white-space:nowrap}
/* control map, quick play, heat */
.power{margin:12px -16px 0;padding:10px 16px 8px;background:#0e131c;border-top:1px solid var(--line)}
.power .bar{height:16px;margin:6px 0}
.regs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.regs i{font-style:normal;font-weight:700}
.pin{cursor:pointer}
.pin.fog{background:rgba(40,44,52,.85);border-style:dashed;border-top:1px dashed rgba(255,255,255,.3);color:#c9ced8}
.pin.fire{border-color:#ff8a3d;box-shadow:0 0 0 2px rgba(255,120,40,.45),0 0 14px rgba(255,120,40,.6);animation:firepin .7s ease-in-out infinite alternate}
.pin .fl{position:absolute;top:-13px;right:-7px;font-size:14px;font-style:normal;animation:flick .5s ease-in-out infinite alternate}
@keyframes firepin{to{box-shadow:0 0 0 3px rgba(255,160,60,.6),0 0 22px rgba(255,90,30,.8)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip2{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip2.hot{background:#3a1a0e;border-color:#ff8a3d;color:#ffcf9a;animation:firepin .8s ease-in-out infinite alternate}
.qq{font-weight:800;font-size:17px;text-align:center;margin:14px 0 4px}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 8px}
.qb{min-height:96px;border-radius:16px;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;transition:transform .12s}
.qb span{font-size:26px;line-height:1}.qb b{font-size:19px}.qb small{font-size:12px;opacity:.85;font-weight:600}
.qb.up{background:linear-gradient(160deg,#ff5a6a,#c3243a)}.qb.down{background:linear-gradient(160deg,#5b9bff,#1f4fc0)}
.qb:active{transform:scale(.95)}.qb:disabled{opacity:.5}
.inl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ib{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.ib.on{border-color:var(--gold);background:#2a2412}.ib.u{border-color:#6b2a33;color:#ffb3bb}.ib.d{border-color:#23406e;color:#a9c8ff}
.ib:active{transform:scale(.94)}
.mycall{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mycall .s2{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.mycall .st{font-size:12px;font-weight:700}.mycall .st.win{color:#4ade80}.mycall .st.lose{color:#fca5a5}
.onb{border-color:#6b5a1e;background:linear-gradient(160deg,#231f10,var(--card))}
.onb .x{background:none;border:0;color:var(--muted);font-size:18px;width:36px;height:36px}
.steps{list-style:none;padding:0;margin:8px 0 12px;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px}
.steps li b{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1d1600;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Galmuri11',monospace}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.rules button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;text-align:left;padding:6px 10px;line-height:1.3}
.rules button.on{border-color:var(--gold);background:#2a2412;color:var(--gold);font-weight:700}
.rules button:disabled{opacity:.35}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cr>div{min-width:0}.cr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field.fire:after{content:'';position:absolute;left:0;right:0;bottom:0;height:60%;pointer-events:none;background:linear-gradient(0deg,rgba(255,90,20,.32),transparent);animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
.bondnote{font-size:12px;color:var(--muted);margin-top:4px}
/* motion */
#mapfx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bar .bu{transform-origin:left}.bar .bd{transform-origin:right}
.tick-up,.tick-down{border-radius:4px}
.tick-up{animation:tku .9s ease-out}.tick-down{animation:tkd .9s ease-out}
@keyframes tku{0%{background:rgba(240,68,82,.5);box-shadow:0 0 0 3px rgba(240,68,82,.5)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
@keyframes tkd{0%{background:rgba(59,130,246,.5);box-shadow:0 0 0 3px rgba(59,130,246,.5)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
.delta{position:absolute;z-index:5;pointer-events:none;font:800 11px Pretendard,sans-serif;transform:translate(-50%,-50%);animation:delta 1.6s ease-out forwards;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
@keyframes delta{0%{opacity:0;transform:translate(-50%,-20%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
#ticker{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:29;height:28px;overflow:hidden;background:#0a0e15;border-top:1px solid var(--line)}
#ticker .lbl{position:absolute;left:0;top:0;bottom:0;z-index:2;background:var(--up);color:#fff;font:700 11px 'Galmuri11',monospace;padding:0 10px;display:flex;align-items:center;box-shadow:6px 0 10px #0a0e15}
#ticker .lbl:after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;margin-left:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#ticker .track{display:inline-flex;gap:18px;white-space:nowrap;padding-left:100vw;animation:marq 60s linear infinite;font-size:12.5px;line-height:28px;will-change:transform}
#ticker .track i{color:var(--line);font-style:normal}
@keyframes marq{to{transform:translateX(-100%)}}
.news{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:rgba(20,26,36,.97);border:1px solid var(--gold);color:var(--text);padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;max-width:calc(100vw - 32px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:newsin .4s cubic-bezier(.2,.9,.2,1.2),newsout .4s ease-in 3.3s forwards}
.news b{color:var(--gold);margin-right:6px;font-family:'Galmuri11',monospace}
@keyframes newsin{from{opacity:0;transform:translate(-50%,-140%)}}
@keyframes newsout{to{opacity:0;transform:translate(-50%,-140%)}}
.reveal{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(0,0,0,.75);animation:fadein .2s}
.reveal .hero{position:relative;font-family:'Galmuri11',monospace;font-size:48px;line-height:1.1;animation:slam .55s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 5px 0 #000}
.reveal canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes slam{from{transform:scale(3.2) rotate(-8deg);opacity:0}}
@keyframes fadein{from{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{15%{transform:translate(-4px,2px)}30%{transform:translate(4px,-2px)}45%{transform:translate(-3px,-1px)}60%{transform:translate(3px,1px)}80%{transform:translate(-1px,1px)}}
.tabbar a.on .ic{animation:hop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes hop{40%{transform:translateY(-6px) scale(1.15)}}
.btn:active,.rx:active,.pin:active,.cats button:active,.sortt button:active,.seg button:active{transform:scale(.94)}
.btn,.rx,.pin,.cats button,.sortt button,.seg button{transition:transform .12s}
#app.fresh .post,#app.fresh .card,#app.fresh .flist a,#app.fresh .art,#app.fresh .summary>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#app.fresh .post:nth-of-type(2),#app.fresh .flist a:nth-child(2),#app.fresh .card:nth-of-type(2),#app.fresh .summary>*:nth-child(2){animation-delay:.05s}
#app.fresh .post:nth-of-type(3),#app.fresh .flist a:nth-child(3),#app.fresh .card:nth-of-type(3),#app.fresh .summary>*:nth-child(3){animation-delay:.1s}
#app.fresh .post:nth-of-type(4),#app.fresh .card:nth-of-type(4){animation-delay:.15s}
#app.fresh .post:nth-of-type(5),#app.fresh .card:nth-of-type(5){animation-delay:.2s}
#app.fresh .post:nth-of-type(n+6){animation-delay:.25s}
#app.fresh .bar i{animation:growx .9s cubic-bezier(.2,.8,.2,1) both .15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes growx{from{transform:scaleX(0)}}
.flist .nm .s{transition:color .3s}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important}#ticker .track{padding-left:12px}}
</style>

<body>
<div class="wrap"><main id="app"><div class="skel"></div><div class="skel"></div></main></div>
<div id="ticker" aria-label="속보"><span class="lbl">속보</span><div class="track"></div></div>
<nav class="tabbar"><div class="in">
  <a href="#/" data-tab="home"><span class="ic">🗺</span>전황</a>
  <a href="#/square" data-tab="square"><span class="ic">📣</span>광장</a>
  <a href="#/battles" data-tab="battles"><span class="ic">⚔️</span>결전</a>
  <a href="#/barracks" data-tab="barracks"><span class="ic">🎨</span>병영</a>
  <a href="#/me" data-tab="me"><span class="ic">🎖</span>내 정보</a>
</div></nav>
<script>
'use strict';
/* ========================================================== setup */
const CFG = window.MW_CONFIG || {};
const sb = (CFG.url && !CFG.url.startsWith('__')) ? supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
const PAL = ['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];
const RX = {charge:['⚔️','돌격'], shield:['🛡','방어'], flag:['🏳️','항복'], medal:['🎖','훈장'], pray:['🙏','같이 빌기'], hug:['🫂','토닥'], metoo:['😭','나도 그래'], lol:['🤣','ㅋㅋ']};
const CATS = [['forecast','📡','전망'],['bet','🎲','내기'],['wish','🙏','기원'],['vent','😩','푸념'],['info','📰','정보'],['chat','💬','잡담']];
const CAT = Object.fromEntries(CATS.map(([k,e,n]) => [k, {e, n}]));
const RXSET = {forecast:['charge','shield','flag','medal'], bet:['charge','shield','flag','medal'], wish:['pray','medal','hug','lol'], vent:['hug','metoo','lol','medal'], info:['medal','charge','metoo','lol'], chat:['lol','metoo','hug','charge']};
const rxSum = p => Object.keys(RX).reduce((s, k) => s + (p['rx_' + k] || 0), 0);
const catChips = (sel, act) => `<div class="cats"><button class="${!sel ? 'on' : ''}" data-act="${act}" data-v="">전체</button>${CATS.map(([k,e,n]) => `<button class="${sel === k ? 'on' : ''}" data-act="${act}" data-v="${k}">${e} ${n}</button>`).join('')}</div>`;
const REGION = {KR:'🇰🇷 코리아', JP:'💱 환율 협곡', CRYPTO:'⛰ 크립토 고원', US:'🗽 아메리카', FRONTIER:'🌫 개척지'};
const ALLOWED_LINKS = ['naver.com','dart.fss.or.kr','kind.krx.co.kr','yna.co.kr','hankyung.com','mk.co.kr','sec.gov','reuters.com','bloomberg.com','coindesk.com','federalreserve.gov','bok.or.kr'];

/* ========================================================== utils */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const T = s => new Date(s).getTime();
function ago(t){ const s = (now() - T(t)) / 1000; if (s < 60) return '방금'; if (s < 3600) return Math.floor(s/60) + '분 전'; if (s < 86400) return Math.floor(s/3600) + '시간 전'; return Math.floor(s/86400) + '일 전'; }
function mmss(ms){ if (ms <= 0) return '판정 중'; const s = Math.ceil(ms/1000), m = Math.floor(s/60); if (m >= 60) return Math.floor(m/60) + '시간 ' + (m%60) + '분'; return m + ':' + String(s%60).padStart(2,'0'); }
function toast(msg){ $('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function isTyping(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
const errMsg = e => (e && (e.message || e.error_description)) || '잠시 후 다시 시도해 주세요';
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
const empty = m => `<div class="empty">${m}</div>`;
const disc = () => `<div class="disc">재미로 하는 전쟁 놀이이며 투자 권유가 아닙니다. 포인트·상금 없음.<br>시세는 지연될 수 있어요 · 코인=바이낸스, 주식·지수·환율=Yahoo, 국채·수급=네이버</div>`;

/* ========================================================== territories & prices */
const A = {};
let ASSETS = [];
let FORCES = {};
const HIST = {};
function fmtP(a, p){
  p = p ?? a.price; if (p == null) return '-';
  const n2 = x => x.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (a.kind === 'BOND') return p.toFixed(3) + '%';
  if (a.kind === 'FX') return n2(p) + '원';
  if (a.kind === 'INDEX') return n2(p);
  if (a.unit === 'KRW') return '₩' + Math.round(p).toLocaleString('ko-KR');
  return '$' + n2(p);
}
function fmtC(a){
  if (a.kind === 'BOND'){ const bp = (a.change || 0) * 100; return (bp > 0 ? '+' : '') + bp.toFixed(1) + 'bp'; }
  const c = a.change_pct || 0; return (c > 0 ? '+' : '') + c.toFixed(2) + '%';
}
// bonds trade on yield: a falling yield is a stronger bond, so it counts as 상승군
const mv = a => a.kind === 'BOND' ? -(a.change || 0) : (a.change_pct || 0);
const score = a => Math.max(-1, Math.min(1, mv(a) / a.threshold));
const dir = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const control = a => Math.round(50 + 50 * score(a));
const isOpen = a => a.market_open !== false;
function heat(a){
  if (!a) return 0;
  const f = FORCES[a.symbol] || {}, vr = +a.vol_ratio || 0;
  let h = Math.abs(score(a)) * .55 + Math.min(.45, Math.max(0, (vr - 1) * .25)) + Math.min(.3, (f.recent || 0) * .08) + .05;
  if (!isOpen(a)) h *= .35;
  return Math.min(1, h);
}
const heatLbl = h => h >= .75 ? '🔥🔥 대화재' : h >= .5 ? '🔥 불타는 중' : h >= .3 ? '⚔️ 교전 격화' : '';
function heatChips(a){
  const h = heat(a), f = FORCES[a.symbol] || {}, vr = +a.vol_ratio || 0, out = [];
  if (heatLbl(h)) out.push(`<span class="chip2 ${h >= .5 ? 'hot' : ''}">${heatLbl(h)}</span>`);
  out.push(`<span class="chip2">${isOpen(a) ? '🟢 장중' : '🌙 장 마감'}</span>`);
  if (vr >= 1.3) out.push(`<span class="chip2 ${vr >= 2 ? 'hot' : ''}">📈 거래량 평소의 ${vr.toFixed(1)}배</span>`);
  if (f.recent) out.push(`<span class="chip2">⚔️ 1시간 참전 ${f.recent}명</span>`);
  return out.join('');
}
function stateOf(a){
  const s = score(a);
  if (!isOpen(a)) return s > .15 ? '🏳️ 휴전 · 상승군 점령 유지' : s < -.15 ? '🏳️ 휴전 · 하락군 점령 유지' : '🏳️ 휴전 중 (장 마감)';
  if (s >= .6) return '🔥 상승군 대공세'; if (s >= .15) return '⚔️ 상승군 우세';
  if (s > -.15) return '🛡 교착 상태'; if (s > -.6) return '⚔️ 하락군 우세'; return '💥 하락군 대공세';
}
function colOf(s){ if (Math.abs(s) < .05) return '#8a8f99'; const k = .35 + .65 * Math.abs(s); return s > 0 ? `rgba(240,68,82,${k.toFixed(2)})` : `rgba(59,130,246,${k.toFixed(2)})`; }
async function loadAssets(){
  const { data, error } = await sb.from('assets').select('*').order('sort');
  if (error) throw error;
  ASSETS = data.map(r => { const o = A[r.symbol] || {}; const live = o.liveWS && now() - o.liveAt < 15000;
    const keep = o.frontier && o._onMap ? {lon:o.lon, lat:o.lat} : {lon:+r.lon, lat:+r.lat};
    Object.assign(o, r, {threshold:+r.threshold, vol_ratio:r.vol_ratio == null ? null : +r.vol_ratio}, keep);
    if (live){ o.price = o._p; o.change = o._c; o.change_pct = o._cp; } else { o.price = r.price == null ? null : +r.price; o.change = +r.change || 0; o.change_pct = +r.change_pct || 0; }
    A[r.symbol] = o; return o; }).filter(o => o.active !== false);
  layoutFrontier();
}
async function loadForces(){ try { const d = await rpc('front_forces'); FORCES = {}; d.forEach(x => FORCES[x.symbol] = x); } catch(e){} }
function onAssetRow(r){
  const a = A[r.symbol]; if (!a) return;
  const live = a.liveWS && now() - a.liveAt < 15000;
  Object.assign(a, r, {threshold:+r.threshold, lon:+r.lon, lat:+r.lat});
  const prev = a.price;
  if (live){ a.price = a._p; a.change = a._c; a.change_pct = a._cp; } else { a.price = +r.price; a.change = +r.change; a.change_pct = +r.change_pct; }
  if (HIST[r.symbol]) HIST[r.symbol].push(+r.price);
  if (!live && prev && a.price !== prev){ mapDelta(a, prev); }
  scheduleLive(); MAPDIRTY = true;
}
let wsTry = 0;
function connectBinance(){
  let ws; try { ws = new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@ticker/ethusdt@ticker'); } catch(e){ return retryWS(); }
  ws.onmessage = ev => { let d; try { d = JSON.parse(ev.data).data; } catch(e){ return; } const a = A[d.s]; if (!a) return;
    if (a._dBase == null || now() - (a._dAt || 0) > 6000){ if (a._dBase != null && +d.c !== a._dBase) mapDelta(a, a._dBase, +d.c); a._dBase = +d.c; a._dAt = now(); }
    a._p = a.price = +d.c; a._c = a.change = +d.p; a._cp = a.change_pct = +d.P; a.liveWS = true; a.liveAt = now(); wsTry = 0; scheduleLive(); };
  ws.onclose = () => retryWS();
}
function retryWS(){ setTimeout(connectBinance, Math.min(30000, 1000 * 2 ** wsTry++)); }
let liveQ = false;
function scheduleLive(){ if (!liveQ){ liveQ = true; requestAnimationFrame(refreshLive); } }
function refreshLive(){
  liveQ = false;
  $$('[data-p]').forEach(el => { const a = A[el.dataset.p]; if (!a) return; const v = a.price;
    if (el._v != null && v != null && v !== el._v){ el.classList.remove('tick-up','tick-down'); void el.offsetWidth; el.classList.add(v > el._v ? 'tick-up' : 'tick-down'); }
    el._v = v; el.textContent = fmtP(a); });
  $$('[data-c]').forEach(el => { const a = A[el.dataset.c]; if (!a) return; el.textContent = fmtC(a); el.classList.remove('up','down','flat'); el.classList.add(dir(mv(a))); });
  $$('[data-ctl]').forEach(el => { const a = A[el.dataset.ctl]; if (a) el.style.width = control(a) + '%'; });
  $$('[data-st]').forEach(el => { const a = A[el.dataset.st]; if (a) el.textContent = stateOf(a); });
  $$('[data-tag]').forEach(el => { const a = A[el.dataset.tag]; if (!a) return; const live = a.liveWS && now() - a.liveAt < 15000;
    el.textContent = live ? '● 실시간' : !isOpen(a) ? '장 마감' : a.delayed ? '지연 시세' : '● 실시간'; el.classList.toggle('live', live || (isOpen(a) && !a.delayed)); });
  $$('[data-pin]').forEach(el => { const a = A[el.dataset.pin]; if (!a) return; el.style.borderTopColor = colOf(score(a)); el.classList.toggle('fire', heat(a) >= .5); el.classList.toggle('hot', Math.abs(score(a)) > .45 && isOpen(a)); });
  $$('[data-fl]').forEach(el => { const a = A[el.dataset.fl]; if (!a) return; const c = control(a); el.textContent = el.dataset.side === 'U' ? `상승군 ${c}%` : `${100-c}% 하락군`; });
}

/* ========================================================== pixel flags */
const ARTS = {}, pxCache = {}, FLAGIMG = {};
function pxURL(px){
  if (!px) return '';
  if (pxCache[px]) return pxCache[px];
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  for (let i = 0; i < 1024; i++){ const ch = px[i]; if (ch === '.') continue; g.fillStyle = PAL[parseInt(ch,16)]; g.fillRect(i%32, i>>5, 1, 1); }
  return pxCache[px] = c.toDataURL();
}
async function loadArts(){ const { data } = await sb.from('pixel_arts').select('*').order('uses_count', {ascending:false}).limit(300); (data || []).forEach(a => ARTS[a.id] = a); }
const flagURL = id => pxURL((ARTS[id] || ARTS['f-white'] || {}).px);
const flagImg = (id, cls) => `<img class="flag px ${cls || ''}" src="${flagURL(id)}" alt="">`;
function prepFlagImgs(){ ['f-bull','f-bear'].forEach(id => { if (FLAGIMG[id] || !ARTS[id]) return; const im = new Image(); im.src = flagURL(id); FLAGIMG[id] = im; }); }

/* ========================================================== me */
let ME = null;
async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ ME = null; return; }
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  ME = data || null;
}
function rankOf(st){
  const t = st.total || 0, r = t ? st.wins / t : 0;
  if (t < 3) return '훈련병'; if (t < 10) return '이병'; if (t < 20) return '일병'; if (t < 30) return '상병';
  if (r >= .7) return '⭐ 백전노장'; if (r >= .6) return '대위'; if (r <= .3) return '🕵️ 적군 첩자 의심'; return '병장';
}
let LAST_ACT = null;
function need(){ if (!ME){ UI.pending = LAST_ACT; nickModal(); return false; } return true; }
const ADJ = ['용감한','졸린','배고픈','존버하는','물린','신난','침착한','성급한','눈치빠른','겁없는','떡상한','흔들리는','든든한','날쌘'];
const NOUN = ['이병','척후병','포병','기마병','수병','나팔수','보급병','저격수','공병','통신병','돌격대','파수꾼'];
const randName = () => ADJ[Math.random() * ADJ.length | 0] + NOUN[Math.random() * NOUN.length | 0] + (10 + Math.random() * 90 | 0);
function nickModal(){
  const first = !ME;
  modal(`<div class="pix" style="font-size:20px;color:var(--gold)">⚔️ ${first ? '입대' : '개명'}</div>
    <div class="muted s" style="margin-top:6px">${first ? '이름만 정하면 끝! 아무 이름이나 괜찮고 나중에 바꿀 수 있어요.' : '새 이름을 정해 주세요.'}</div>
    <div class="row" style="margin-top:14px"><input class="f" id="nk" maxlength="12" placeholder="병사 이름 (2~12자)" autocomplete="off" value="${first ? randName() : ''}"><button class="btn" data-act="reroll" aria-label="다른 이름">🎲</button></div>
    <button class="btn pri full" style="margin-top:10px" data-act="nick">${first ? (UI.pending ? '입대하고 계속하기 ›' : '입대하기') : '바꾸기'}</button>`);
  setTimeout(() => { const i = $('#nk'); if (i){ i.focus(); i.select(); } }, 50);
}
async function doNick(){
  const n = $('#nk').value.trim(); if (n.length < 2) return toast('이름은 2~12자');
  const btn = $('[data-act=nick]'); btn.disabled = true;
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session){ const { error } = await sb.auth.signInAnonymously(); if (error) throw error; }
    const first = !ME; ME = await rpc('set_nickname', {nick:n});

const PX = {data:new Array(1024).fill(-1), undo:[], down:false};
function pxInit(){
  const cv = $('#pxc'); pxDraw();
  const cell = ev => { const r = cv.getBoundingClientRect(); const x = Math.floor((ev.clientX - r.left) / r.width * 32), y = Math.floor((ev.clientY - r.top) / r.height * 32); return x < 0 || y < 0 || x > 31 || y > 31 ? -1 : y * 32 + x; };
  const paint = i => { if (i < 0) return; const c = UI.tool === 'eraser' ? -1 : UI.color; if (UI.tool === 'fill') return fill(i, c); if (PX.data[i] !== c){ PX.data[i] = c; pxDraw(); } };
  cv.onpointerdown = ev => { ev.preventDefault(); cv.setPointerCapture(ev.pointerId); PX.undo.push(PX.data.slice()); if (PX.undo.length > 50) PX.undo.shift(); PX.down = UI.tool !== 'fill'; paint(cell(ev)); };
  cv.onpointermove = ev => { if (PX.down) paint(cell(ev)); };
  cv.onpointerup = cv.onpointercancel = () => PX.down = false;
}
function fill(i, c){
  const t = PX.data[i]; if (t === c) return; const st = [i];
  while (st.length){ const k = st.pop(); if (PX.data[k] !== t) continue; PX.data[k] = c; const x = k % 32, y = k >> 5; if (x > 0) st.push(k-1); if (x < 31) st.push(k+1); if (y > 0) st.push(k-32); if (y < 31) st.push(k+32); }
  pxDraw();
}
function pxDraw(){
  const cv = $('#pxc'); if (!cv) return; const g = cv.getContext('2d'), s = 11;
  for (let i = 0; i < 1024; i++){ const x = (i % 32) * s, y = (i >> 5) * s, c = PX.data[i]; g.fillStyle = c < 0 ? (((i % 32) + (i >> 5)) % 2 ? '#1a2130' : '#212a3a') : PAL[c]; g.fillRect(x, y, s, s); }
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.beginPath();
  for (let k = 0; k <= 32; k++){ g.moveTo(k*s + .5, 0); g.lineTo(k*s + .5, 352); g.moveTo(0, k*s + .5); g.lineTo(352, k*s + .5); } g.stroke();
}

let OWNIMG = null;
function memeDraw(){
  const cv = $('#mmc'); if (!cv) return; const g = cv.getContext('2d'), W = 600, t = UI.mtpl;
  const rays = (c1, c2) => { g.fillStyle = c1; g.fillRect(0, 0, W, W); g.fillStyle = c2; for (let k = 0; k < 18; k++){ const a0 = k / 18 * Math.PI * 2, a1 = a0 + Math.PI / 18; g.beginPath(); g.moveTo(W/2, W/2 + 40); g.lineTo(W/2 + Math.cos(a0) * 900, W/2 + 40 + Math.sin(a0) * 900); g.lineTo(W/2 + Math.cos(a1) * 900, W/2 + 40 + Math.sin(a1) * 900); g.fill(); } };
  if (t === 'chart'){
    const a = A[UI.msym], h = HIST[UI.msym] && HIST[UI.msym].length > 1 ? HIST[UI.msym] : null;
    g.fillStyle = '#0b0f17'; g.fillRect(0, 0, W, W);
    g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1; for (let k = 1; k < 6; k++){ g.beginPath(); g.moveTo(0, k*100); g.lineTo(W, k*100); g.stroke(); }

      h.forEach((v,i) => { const x = 20 + i / (h.length - 1) * (W - 40), y = 480 - (v - mn) / rg * 290; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke(); }

    g.fillStyle = '#e8ebf1'; g.font = 'bold 24px Pretendard, sans-serif'; g.textAlign = 'left'; g.fillText(a.name + '  ' + fmtP(a), 24, 150);
    g.fillStyle = col; g.textAlign = 'right'; g.fillText(fmtC(a), W - 24, 150);
  } else if (t === 'bull' || t === 'bear'){
    rays(t === 'bull' ? '#b3122b' : '#123a8f', t === 'bull' ? '#d22a43' : '#1d4fd8');
    const im = FLAGIMG[t === 'bull' ? 'f-bull' : 'f-bear'];
    if (im && im.complete){ g.imageSmoothingEnabled = false; g.drawImage(im, W/2 - 140, W/2 - 120, 280, 280); } else if (im) im.onload = memeDraw;

    if (OWNIMG) g.drawImage(OWNIMG, 0, 0, W, W); else { g.fillStyle = '#8792a6'; g.font = '24px Pretendard, sans-serif'; g.textAlign = 'center'; g.fillText('위에서 이미지를 골라 주세요', W/2, W/2); }

function memeText(g, text, y, bottom){
  if (!text) return; const W = 600; g.textAlign = 'center'; g.lineJoin = 'round';
  let size = 56; g.font = `900 ${size}px Pretendard, sans-serif`;

function onUpload(f){

    if (!p.result || SETTLED.has(p.id) || T(p.settle_at) < now() - 300000 || !['forecast','bet','wish'].includes(p.category)) return; SETTLED.add(p.id);
    const n = await nickOf(p.author_id), a = A[p.symbol]?.name || '';
    pushEvent(p.category === 'wish' ? (p.result === 'WIN' ? `✨ ${n}의 ${a} 기원 성취!` : `🕯 ${n}의 ${a} 기원은 다음 기회에`) : (p.result === 'WIN' ? `🎖 ${n} ${a} ${SIDE[p.side]} 승전!` : `💀 ${n} ${a} ${SIDE[p.side]} 패전`), false);
    if (ME && p.author_id === ME.id) watchResults();
  };
  sb.channel('events')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'posts'}, posted)
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'posts'}, scored)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'post_joins'}, async ({new: j}) => { const n = await nickOf(j.user_id); pushEvent(`🔥 ${n}님이 내기에 ${SIDE[j.side]}으로 끼어들었어요`, !ME || j.user_id !== ME.id); })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'battle_entries'}, async ({new: e}) => { const n = await nickOf(e.user_id); pushEvent(`📯 ${n}님이 결전 ${e.option} 진영에 참전`, false); })
    .subscribe();
}
async function seedEvents(){
  const { data } = await sb.from('posts').select('category,title,side,symbol,result,author:profiles!posts_author_id_fkey(nickname)').order('created_at', {ascending:false}).limit(5);
  (data || []).reverse().forEach(p => { const n = p.author?.nickname || '누군가', a = A[p.symbol]?.name || '';
    EVENTS.unshift({txt: p.result ? `${p.result === 'WIN' ? '🎖' : '💀'} ${n} ${a} ${p.category === 'wish' ? (p.result === 'WIN' ? '기원 성취' : '기원 불발') : SIDE[p.side] + (p.result === 'WIN' ? ' 승전' : ' 패전')}` : `${CAT[p.category]?.e || '📣'} ${n}: ${p.title}`, at: now() - 1}); });
  renderTicker(true);
}

/* ========================================================== boot */
(async function boot(){
  if (!sb){ $('#app').innerHTML = empty('서버 설정이 아직 없어요 (config.js)'); return; }
  try { await Promise.all([loadAssets(), loadArts(), loadMe()]); }
  catch(e){ $('#app').innerHTML = topbar() + empty('서버에 연결하지 못했어요: ' + esc(errMsg(e)) + '<br><button class="btn sm" style="margin-top:12px" onclick="location.reload()">다시 시도</button>'); return; }
  sb.channel('assets').on('postgres_changes', {event:'UPDATE', schema:'public', table:'assets'}, p => onAssetRow(p.new)).subscribe();
  subscribeEvents(); seedEvents().catch(() => renderTicker(true));
  connectBinance();
  setInterval(() => $$('[data-cd]').forEach(el => el.textContent = mmss(+el.dataset.cd - now())), 1000);
  setInterval(() => { softRender(); watchResults(); }, 30000);
  setInterval(async () => { try { await loadAssets(); scheduleLive(); MAPDIRTY = true; } catch(e){} }, 120000);
  render();
})();
</script>
