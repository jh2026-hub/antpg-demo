<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘 장 어땠어?</title>
<meta name="description" content="종목마다 방이 있고, 그 방 날씨는 주가가 정해요. 들어가서 기분 한 번 누르고 서로 토닥이는 곳">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫠</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--soft:#f1eee7;--line:#e7e2d8;--text:#1f2126;--muted:#868a93;--up:#f04452;--down:#3182f6;--accent:#ff8a3d;--accent-soft:#fff1e6;--shadow:0 2px 10px rgba(30,25,15,.06);--r:18px}
@media (prefers-color-scheme: dark){:root{--bg:#14161b;--card:#1d2027;--soft:#252932;--line:#2e333d;--text:#eceef2;--muted:#8e95a2;--accent-soft:#3a2a1c;--shadow:0 2px 10px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}.s{font-size:12.5px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}
.top{position:sticky;top:0;z-index:1200;margin:0 -16px;padding:12px 16px 10px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:20px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;width:36px;height:36px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.me{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.h2{font-size:17px;font-weight:800;margin:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 6px}
.sec h3{font-size:16px;margin:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fbf71;animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.3}}

/* ---------- scene colors: sky by weather, ground by place (shared by room cards and the plaza) */
.scene{--sky1:#a9d4ff;--sky2:#e3f1ff;--g1:#b9e08e;--g2:#8fc566;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 40%,var(--g1) 40%,var(--g2) 100%)}
.p-park{--g1:#b9e08e;--g2:#8fc566}.p-beach{--g1:#f6e2ab;--g2:#e9c97c}.p-city{--g1:#c3c6cd;--g2:#9da1ab}.p-square{--g1:#e6dac6;--g2:#cdbda2}
.w-fest{--sky1:#ff9f5a;--sky2:#ffe3a3}.w-sunny{--sky1:#5cb8ff;--sky2:#d2efff}.w-clear{--sky1:#a9d4ff;--sky2:#e6f3ff}.w-cloud{--sky1:#b4c0cf;--sky2:#e1e6ec}
.w-rain{--sky1:#7f8c9f;--sky2:#bcc5d0}.w-storm{--sky1:#3e4656;--sky2:#6f7888}
.w-quake{--sky1:#857a6c;--sky2:#cdbfa9}
.w-nuke{--sky1:#3a1c12;--sky2:#d0602c;--g1:#6e5c4b;--g2:#463a30}
.frozen{--g1:#eef6fb;--g2:#cfe2ee}.frozen.w-cloud,.frozen.w-clear{--sky1:#bcd9ee;--sky2:#eef8ff}
.peak{--g1:#f3e3a0;--g2:#d9bf62}
.night{--sky1:#0b1430!important;--sky2:#26365c!important}
.w-fest.night{--sky1:#2a1350!important;--sky2:#5a2f74!important}
.w-nuke.night{--sky1:#160805!important;--sky2:#7a2a14!important}
@media (prefers-color-scheme: dark){.scene{filter:brightness(.88)}}

/* ---------- home: rooms */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.room{display:block;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .12s}
.room:active{transform:scale(.97)}
.mini{position:relative;height:86px;overflow:hidden}
.mini .mw{position:absolute;right:8px;top:6px;font-size:28px;line-height:1}
.mini .mem{position:absolute;left:8px;bottom:6px;font-size:16px;letter-spacing:-2px;white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden}
.mini .mon{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;background:rgba(255,255,255,.85);color:#1f2126;padding:1px 7px;border-radius:999px;display:flex;align-items:center;gap:4px}
.mini .mon:empty{display:none}
.rinfo{padding:9px 11px 11px}.rinfo b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rinfo .num{flex:none;white-space:nowrap}
.mini .md{position:absolute;font-size:18px;line-height:1;transform:translate(-50%,-100%);pointer-events:none}
.mini .sea{position:absolute;left:0;right:0;top:33%;height:9%;background:linear-gradient(#5fb4e8,#8fd0f0)}.mini.frozen .sea{background:#dcefff}
.mini .mbadge{position:absolute;right:6px;bottom:6px;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.88);color:#1f2126;padding:1px 6px;border-radius:999px;z-index:900}
.mini .rainbow{left:6%;top:-6%;width:88%;height:90%}
.mini .fwm{position:absolute;left:30%;top:6%;font-size:20px;animation:fw 2.7s ease-out infinite}
.rinfo .num{font-weight:800;font-size:14px}

/* ---------- plaza */
.plaza{position:relative;height:270px;margin:2px 0 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.plaza .sea{position:absolute;left:0;right:0;top:33%;height:9%;background:linear-gradient(#5fb4e8,#8fd0f0);border-bottom:3px solid rgba(255,255,255,.7)}
.frozen .sea{background:linear-gradient(#cfe9f7,#eaf6fc)}
.plaza .skyline{position:absolute;left:-4%;right:-4%;top:21%;font-size:44px;line-height:1;letter-spacing:-6px;white-space:nowrap;opacity:.8;text-align:center}
.plaza .deco{position:absolute;font-size:26px;line-height:1;transform:translate(-50%,-100%);pointer-events:none}
.plaza .orb{position:absolute;right:16px;top:40px;font-size:30px;z-index:2;pointer-events:none}
.plaza .shade,.mini .shade{position:absolute;inset:0;background:rgba(5,10,40,.28);z-index:3;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twk 2.4s infinite alternate}
@keyframes twk{to{opacity:.2}}
.cloud{position:absolute;left:-60px;font-size:34px;z-index:2;opacity:.9;pointer-events:none;animation:drift linear infinite}
@keyframes drift{to{translate:680px 0}}
.w-storm .cloud{filter:grayscale(1) brightness(.6)}.w-rain .cloud{filter:grayscale(.6) brightness(.85)}
.rainbow{position:absolute;left:12%;top:4%;width:76%;height:70%;z-index:1;opacity:.55;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,transparent 54%,#a46ad8 54%,#a46ad8 58%,#3182f6 58%,#3182f6 62%,#2fbf71 62%,#2fbf71 66%,#f2c94c 66%,#f2c94c 70%,#ff8a3d 70%,#ff8a3d 74%,#f04452 74%,#f04452 78%,transparent 78%);clip-path:inset(0 0 42% 0)}
.drops{position:absolute;inset:0;pointer-events:none;z-index:800}
.drops i{position:absolute;top:-20px;width:1.5px;height:14px;background:rgba(255,255,255,.7);animation:fall .8s linear infinite}
@keyframes fall{to{translate:-14px 310px}}
.drops.storm i{height:20px;width:2px;transform:rotate(18deg);animation-name:fallx}@keyframes fallx{to{translate:-90px 310px}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:850;pointer-events:none;animation:flash 5.5s infinite}
@keyframes flash{0%,89%,93%,100%{opacity:0}90%,94%{opacity:.75}}
.flakes i{position:absolute;top:-16px;color:#fff;font-size:11px;font-style:normal;text-shadow:0 0 2px rgba(80,120,160,.6);animation:snow linear infinite;pointer-events:none;z-index:800}
@keyframes snow{0%{translate:0 0}50%{translate:14px 150px}100%{translate:-6px 310px}}
.fws i{position:absolute;font-style:normal;font-size:30px;z-index:4;pointer-events:none;opacity:0;animation:fw 2.7s ease-out infinite}
@keyframes fw{0%{scale:.2;opacity:0}12%{opacity:1}40%{scale:1.4;opacity:1}60%,100%{scale:1.6;opacity:0}}
.confetti i{position:absolute;top:-10px;width:5px;height:8px;z-index:800;pointer-events:none;animation:conf linear infinite}
@keyframes conf{to{translate:20px 300px;rotate:540deg}}
.pzcap,.pzw{position:absolute;top:8px;z-index:900;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.85);color:#1f2126;padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pzcap{left:8px}.pzw{right:8px}
.pzhint{position:absolute;left:8px;right:8px;bottom:7px;text-align:center;font-size:11.5px;font-weight:700;color:#1f2126;z-index:900;pointer-events:none}
.pzhint span{background:rgba(255,255,255,.75);padding:2px 9px;border-radius:999px}
.av{position:absolute;left:0;top:0;width:30px;height:51px;transform-origin:50% 100%;will-change:transform}
.av canvas{display:block;width:30px;height:51px;image-rendering:pixelated}
.frozen .av canvas{filter:saturate(.75) brightness(1.08)}
.av::after{content:'';position:absolute;left:3px;right:3px;bottom:-3px;height:6px;border-radius:50%;background:rgba(0,0,0,.18);z-index:-1}
.av.mine::before{content:'';position:absolute;left:-1px;right:-1px;bottom:-5px;height:9px;border-radius:50%;border:2px solid var(--accent);z-index:-1}
.av.drop canvas{animation:avdrop .55s cubic-bezier(.3,1.6,.5,1)}@keyframes avdrop{from{translate:0 -70px;opacity:0}}
.av .umb{display:none;position:absolute;left:50%;bottom:calc(100% - 14px);transform:translateX(-50%);font-size:30px;line-height:1;pointer-events:none}
.plaza.umb .av .umb{display:block}
.av .mo{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:15px;line-height:1.1}
.plaza.umb .av .mo{bottom:calc(100% + 14px)}
.av .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font-size:10px;font-weight:700;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis;color:#1f2126;background:rgba(255,255,255,.8);padding:0 5px;border-radius:6px}
.av .nm:empty{display:none}.av.mine .nm{background:var(--accent);color:#fff}
.av.on .nm::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#2fbf71;margin-right:3px;vertical-align:1px}
.av .bub{position:absolute;left:50%;bottom:calc(100% + 17px);transform:translateX(-50%) scale(.6);transform-origin:50% 100%;opacity:0;transition:.18s;background:#fff;color:#1f2126;font-size:11.5px;font-weight:600;line-height:1.35;padding:5px 8px;border-radius:10px;width:max-content;max-width:150px;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:none}
.plaza.umb .av .bub{bottom:calc(100% + 32px)}
.av .bub::after{content:'';position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:#fff}
.av .bub.show{opacity:1;transform:translateX(-50%) scale(1)}
.av .emo{position:absolute;left:50%;bottom:100%;font-size:20px;pointer-events:none;animation:emo 1.4s ease-out forwards}
@keyframes emo{0%{translate:-50% 0;scale:.5;opacity:1}100%{translate:-50% -56px;scale:1.3;opacity:0}}
.pzpop{position:absolute;z-index:1000;width:220px;background:var(--card);color:var(--text);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:13px;cursor:default}
.ripple{position:absolute;width:24px;height:10px;margin:-5px 0 0 -12px;border:2px solid rgba(255,255,255,.95);border-radius:50%;pointer-events:none;animation:rip .6s ease-out forwards;z-index:5}
@keyframes rip{to{scale:2.2;opacity:0}}
.emobar{display:flex;gap:6px;align-items:center;margin:8px -16px 0;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}.emobar::-webkit-scrollbar{display:none}
.emobar button{flex:none;width:42px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;transition:transform .12s}.emobar button:active{transform:scale(.88)}

/* ---------- moods, feed, forms */
.moodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--soft);font-weight:700;font-size:13.5px;transition:transform .12s}
.mb span{font-size:28px;line-height:1.1}.mb:active{transform:scale(.94)}.mb.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.dist{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft);margin:10px 0 8px}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}.legend b{color:var(--text)}
.post{background:var(--card);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:var(--shadow);display:block}
.post .hd{display:flex;align-items:center;gap:10px}
.post .em{font-size:30px;line-height:1;flex:none}
.post .who{font-size:13px;color:var(--muted);min-width:0}.post .who b{color:var(--text)}
.post .body{margin:8px 0 2px;white-space:pre-wrap;font-size:15.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--text);margin-left:4px;vertical-align:1px}
.botb{font-size:10.5px;padding:0 6px;border-radius:999px;background:#e7efff;color:#3b6fd8;margin-left:4px;vertical-align:1px}
@media (prefers-color-scheme: dark){.botb{background:#21324f;color:#9cc2ff}}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rb{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;transition:transform .12s;position:relative}
.rb:active{transform:scale(.92)}.rb.on{background:var(--accent-soft);color:var(--accent)}
.rb .pop{position:absolute;left:50%;top:-4px;pointer-events:none;font-size:20px;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(-50%,-40px) scale(1.3);opacity:0}}
.cnt{margin-left:auto;font-size:13px;color:var(--muted);align-self:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--soft);font-weight:700}
.btn.pri{background:var(--accent);color:#fff}.btn.full{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;outline:none}
.f:focus{border-color:var(--accent)}
textarea.f{min-height:90px;resize:none}
.opbtn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.ob{padding:12px 4px;border-radius:14px;background:var(--soft);font-weight:700;font-size:14px}
.ob.on{outline:2px solid var(--accent);background:var(--accent-soft)}
.obar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:12px 0 6px;background:var(--soft)}
.obar i{display:block;height:100%;transition:width .6s}
.modal{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1600;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .2s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1300;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tabbar a{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);font-weight:600}
.tabbar a span{font-size:21px;line-height:1.2}.tabbar a.on{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:28px 0;font-size:14px}
.cm{padding:12px 0;border-top:1px solid var(--line)}
.cm .who{font-size:12.5px;color:var(--muted)}.cm .who b{color:var(--text)}
.cm.new{animation:flash2 1.4s}@keyframes flash2{from{background:var(--accent-soft)}}
.care{background:var(--accent-soft);border-radius:14px;padding:14px;margin-top:12px;font-size:14px}
.foot{margin:28px 0 8px;text-align:center;font-size:12px;color:var(--muted)}
.bagstage{position:relative;height:200px;display:flex;justify-content:center;align-items:flex-start;margin-top:10px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bag{position:relative;transform-origin:50% 0}.bag canvas{display:block;width:96px;height:152px;image-rendering:pixelated}
.bag.hl{animation:sl .5s cubic-bezier(.2,1.6,.4,1)}.bag.hr{animation:sr .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes sl{30%{transform:rotate(-16deg)}100%{transform:none}}@keyframes sr{30%{transform:rotate(16deg)}100%{transform:none}}
.baglbl{position:absolute;left:0;right:0;top:62px;text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none}
.pow{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:22px;color:var(--accent);pointer-events:none;animation:pw .7s ease-out forwards}
@keyframes pw{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-150%) scale(1.1);opacity:0}}
.big{font-size:26px;font-weight:900}
.exbox{margin-top:12px;padding:16px;border-radius:14px;background:var(--soft);min-height:100px}
.exbox.roll{animation:roll .4s cubic-bezier(.2,1.5,.4,1)}@keyframes roll{from{transform:rotateX(70deg);opacity:0}}
.exmain{font-size:18px;font-weight:900;margin:6px 0}
@keyframes quake{0%,52%,100%{translate:0 0}4%{translate:-7px 2px}8%{translate:6px -3px}12%{translate:-5px 3px}16%{translate:7px 1px}20%{translate:-6px -2px}24%{translate:4px 3px}28%{translate:-5px -1px}32%{translate:5px 2px}36%{translate:-3px -2px}40%{translate:3px 1px}46%{translate:-1px 0}}
.plaza.w-quake,.mini.w-quake{animation:quake 3.2s infinite}
.w-quake .deco,.w-quake .md{animation:wob .25s infinite alternate}@keyframes wob{from{rotate:-6deg}to{rotate:6deg}}
.cracks{position:absolute;left:0;right:0;top:40%;bottom:0;width:100%;height:60%;z-index:6;pointer-events:none}
.cracks path{fill:none;stroke:#3b2a1a;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:120;animation:crack 3.2s infinite;vector-effect:non-scaling-stroke}
@keyframes crack{0%{stroke-dashoffset:120}30%,100%{stroke-dashoffset:0}}
.blds{position:absolute;left:0;right:0;top:40%;height:0;z-index:5;pointer-events:none}
.blds i{position:absolute;bottom:0;font-style:normal;font-size:40px;line-height:1;transform-origin:50% 100%;animation:topple 8s infinite}

  meh:'대체로 무덤덤. 평화로운 하루', held:'버틴 사람이 제일 많아요. 오늘의 승자들', won:'벌었다는 사람이 제일 많아요. 배 아픈 날'};
const CRISIS = /죽고\s*싶|자살|극단적\s*선택|사라지고\s*싶|살기\s*싫|다\s*끝내고\s*싶/;
const ADJ = ['졸린','배고픈','존버하는','물린','신난','침착한','성급한','눈치빠른','겁없는','흔들리는','든든한','날쌘','멍한','씩씩한'];
const NOUN = ['개미','고래','다람쥐','펭귄','토끼','부엉이','감자','고양이','수달','햄스터','오리','곰돌이'];

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const T = s => new Date(s).getTime();
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => +(a + Math.random() * (b - a)).toFixed(2);
const randName = () => pick(ADJ) + pick(NOUN) + (10 + Math.random() * 90 | 0);
const kstDay = () => new Date(now() + 9 * 3600e3).toISOString().slice(0, 10);
function ago(t){ const s = (now() - T(t)) / 1000; if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; return Math.floor(s / 86400) + '일 전'; }
function toast(m){ $('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const errMsg = e => (e && (e.message || e.error_description)) || '잠시 후 다시 해 주세요';
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
function modal(html){ closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="sheet">${html}</div>`; m.addEventListener('click', e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal(){ $$('.modal').forEach(m => m.remove()); }
const isTyping = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName); };
const WXQ = new URLSearchParams(location.search).get('wx');   // preview: ?wx=fest|sunny|clear|cloud|rain|storm|quake|nuke|night, ?wx=ice (52w low) | peak (52w high)

/* ---------------------------------------------------------------- market + scenes */
const A = {}; let ASSETS = [];
const ICON = {BTCUSDT:'₿', ETHUSDT:'Ξ', SPX:'🇺🇸', NVDA:'🟩', TSLA:'🚗', KOSPI:'🇰🇷', '005930':'📱', '000660':'💾'};
const pct = a => +(a.change_pct || 0);
const fmtC = a => (pct(a) > 0 ? '+' : '') + pct(a).toFixed(2) + '%';
const dir = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
async function loadAssets(){
  const { data } = await sb.from('assets').select('symbol,name,short,kind,region,change_pct,price,market_open,low_52w,high_52w,vol_ratio,flows').eq('active', true).order('sort');
  ASSETS = (data || []).map(r => Object.assign(A[r.symbol] = A[r.symbol] || {}, r));
}
const PLACES = {
  beach:  {n:'코인 해변', deco:[['🌴',8,46],['🌴',93,44],['⛱️',78,92],['🦀',22,92],['🐚',58,95]]},
  park:   {n:'공원',      deco:[['🌳',7,46],['🌲',91,45],['🌳',82,90],['🌷',20,93],['🪑',62,50]]},
  city:   {n:'다운타운',  deco:[['🚦',7,50],['🌭',90,49],['🚕',80,93],['🛴',20,94],['🗽',56,48]]},
  square: {n:'중앙광장',  deco:[['⛲',50,58],['🏛️',9,47],['🗿',91,46],['🕊️',22,92],['🎈',80,92]]},
};
const WX = {
  fest:  {k:'fest',  e:'🎆', n:'축제',   t:'불꽃놀이 터지는 중! 다들 춤춰요', mul:1.3, hop:true},
  sunny: {k:'sunny', e:'🌈', n:'화창',   t:'무지개 떴어요. 발걸음이 가볍네요', mul:1.15},
  clear: {k:'clear', e:'☀️', n:'맑음',   t:'산책하기 좋은 날'},
  cloud: {k:'cloud', e:'⛅', n:'흐림',   t:'애매한 날씨. 다들 눈치 보는 중'},
  rain:  {k:'rain',  e:'🌧️', n:'비',     t:'비 와요. 우산 챙기세요', umb:true, mul:.85},
  storm: {k:'storm', e:'⛈️', n:'폭풍우', t:'천둥번개! 다들 우산 꽉 잡아요', umb:true, mul:.7},
  quake: {k:'quake', e:'🫨', n:'대지진', t:'지진 났어요! 건물이 무너져요. 책상 밑으로!', mul:1.5, shiver:true, quake:true},
  nuke:  {k:'nuke',  e:'☢️', n:'핵폭탄', t:'시장에 핵폭탄 떨어짐. 계좌 증발 중', mul:2.1, panic:true},
};
const placeOf = a => a.kind === 'CRYPTO' ? 'beach' : a.kind === 'INDEX' ? 'square' : a.region === 'US' ? 'city' : 'park';
function scene(a){
  const z = pct(a) / (a.kind === 'INDEX' ? 1 : a.kind === 'CRYPTO' ? 2.5 : 2);
  let w = z >= 2.5 ? 'fest' : z >= 1 ? 'sunny' : z >= .25 ? 'clear' : z > -.25 ? 'cloud' : z > -1 ? 'rain' : z > -2.5 ? 'storm' : z > -4.5 ? 'quake' : 'nuke';
  let night = a.market_open === false && a.kind !== 'CRYPTO';
  const p = +a.price, lo = +a.low_52w, hi = +a.high_52w, pos = hi > lo && lo > 0 ? (p - lo) / (hi - lo) : .5;
  let frozen = lo > 0 && p > 0 && (p <= lo * 1.05 || pos <= .08), peak = hi > 0 && p > 0 && (p >= hi * .97 || pos >= .95);
  if (WXQ === 'night') night = true;
  else if (WXQ === 'ice'){ frozen = true; peak = false; w = 'cloud'; night = false; }
  else if (WXQ === 'peak'){ peak = true; frozen = false; night = false; }
  else if (WXQ && WX[WXQ]){ w = WXQ; night = false; }
  const sc = {...WX[w], w, night, frozen, peak, place: placeOf(a)};
  if (frozen && !sc.panic && !sc.quake){ sc.mul = (sc.mul || 1) * .6; sc.shiver = true; }
  sc.label = `${sc.e} ${sc.n}${frozen ? ' · 🧊 빙하기' : peak ? ' · 🏆 신고가' : ''}`;
  sc.hint = frozen && ['cloud', 'clear', 'sunny', 'rain'].includes(w) ? '52주 저점 근처. 빠질 만큼 빠져서 꽁꽁 얼었어요' : peak && !['quake', 'nuke'].includes(w) ? '52주 신고가 근처! 꼭대기라 공기가 희박해요' : sc.t;
  return sc;
}

  cop_sell:  {e:'🚓', n:'경찰 철수',    t:'기관 경찰도 손 떼고 떠나요. 이제 각자도생'},
  ants_buy:  {e:'🐜', n:'개미 군단',    t:'개미들이 줄지어 들어와요', good:true},

  shark:     {e:'🦈', n:'상어 출현',    t:'상어가 물속을 맴돌아요. 발 조심'},
  rocket:    {e:'🚀', n:'52주 신고가',  t:'로켓 발사! 1년 중 제일 높아요', good:true},
  mammoth:   {e:'🦣', n:'52주 신저가',  t:'매머드가 나타났어요. 1년 중 제일 낮아요'},
  hero:      {e:'🦸', n:'나홀로 영웅',  t:'시장은 빠지는데 혼자 날아다녀요', good:true},

const EVQ = new URLSearchParams(location.search).get('ev');   // preview: ?ev=ufo_sell,cop_buy
const amtEok = v => { const x = Math.abs(v); return (v < 0 ? '−' : '+') + (x >= 1e4 ? (x / 1e4).toFixed(1) + '조' : Math.round(x).toLocaleString('ko-KR') + '억'); };
const refOf = a => a.kind === 'CRYPTO' ? (a.symbol === 'BTCUSDT' ? null : A.BTCUSDT) : a.kind === 'INDEX' ? null : a.region === 'US' ? A.SPX : A.KOSPI;
function events(a){
  if (EVQ) return EVQ.split(',').filter(k => EVCAT[k]).map(k => ({...EVCAT[k], k, why:'미리보기', w:9}));
  const E = [], add = (k, why, w) => E.push({...EVCAT[k], k, why, w});
  const fl = a.flows, f = fl && fl.now;
  if (f && fl.kind === 'investor'){
    const idx = a.kind === 'INDEX', T = idx ? {foreign:5000, inst:3000, retail:5000} : {foreign:1000, inst:1000, retail:2000};
    const when = !fl.live && fl.asof ? ` (${+fl.asof.slice(4, 6)}/${+fl.asof.slice(6)})` : '';
    for (const [who, nm, kb, ks] of [['foreign','외국인','ufo_buy','ufo_sell'], ['inst','기관','cop_buy','cop_sell'], ['retail','개인','ants_buy','ants_sell']]){
      const v = +f[who] || 0;
      if (Math.abs(v) >= T[who]) add(v > 0 ? kb : ks, `${nm} ${amtEok(v)} 순${v > 0 ? '매수' : '매도'}${when}`, Math.abs(v) / T[who]);
    }
  }
  if (fl && fl.kind === 'taker'){
    const hs = (fl.hours || []).slice(-3), b = hs.reduce((x, h) => x + h.buy, 0), sl = hs.reduce((x, h) => x + h.sell, 0), sh = b + sl ? b / (b + sl) : .5;
    if (sh >= .58) add('whale', `최근 3시간 시장가 매수 ${Math.round(sh * 100)}%`, (sh - .5) * 20);
    if (sh <= .42) add('shark', `최근 3시간 시장가 매도 ${Math.round((1 - sh) * 100)}%`, (.5 - sh) * 20);
  }
  const p = +a.price, lo = +a.low_52w, hi = +a.high_52w;
  if (hi > 0 && p >= hi * .999) add('rocket', `52주 최고가 돌파`, 5);
  if (lo > 0 && p <= lo * 1.001) add('mammoth', `52주 최저가 경신`, 5);
  const ref = refOf(a);
  if (ref){ const d = pct(a) - pct(ref), lim = a.kind === 'CRYPTO' ? 4 : 5;
    if (d >= lim) add('hero', `${ref.short}보다 ${d.toFixed(1)}%p 강해요`, d / lim);
    if (d <= -lim) add('bolt', `${ref.short}보다 ${Math.abs(d).toFixed(1)}%p 더 빠졌어요`, -d / lim); }
  if (+a.vol_ratio >= 3) add('bus', `거래량 평소의 ${(+a.vol_ratio).toFixed(1)}배`, +a.vol_ratio / 3);
  return E.sort((x, y) => y.w - x.w).slice(0, 3);
}

function bagDraw(){

async function flushBag(){ clearTimeout(BAG.t); const n = Math.min(40, BAG.pending); if (!n || !BAG.sym) return; BAG.pending -= n;

    } catch(e){ toast(errMsg(e)); }
  },
  report(el){ modal(`<div class="h2">신고 사유</div>${['욕설·비하','홍보·리딩방','도배','기타'].map(r => `<button class="btn full" style="margin-top:8px" data-act="doreport" data-id="${el.dataset.id}" data-v="${r}">${r}</button>`).join('')}<button class="btn full" style="margin-top:14px;background:none" data-act="close">취소</button>`); },
  async doreport(el){ if (!need()) return; try { const n = await rpc('report_mood', {p_type:'mood', p_id: el.dataset.id, p_reason: el.dataset.v}); closeModal(); toast(n >= 3 ? '신고가 쌓여 숨겨졌어요' : '신고했어요'); } catch(e){ closeModal(); toast(errMsg(e)); } },
  more(){ UI.limit += 30; render(true); },
  async op(el){ if (!need()) return; try { await rpc('give_opinion', {p_symbol: UI.room, p_pick: el.dataset.v}); const c = $('#op'); if (c) c.outerHTML = await opinionHTML(); } catch(e){ toast(errMsg(e)); } },
  punch(el, ev){ punchAt(ev || {}); },
  exroll(){ UI.excuse = excuse(); render(true).then(() => { const b = $('#exbox'); if (b){ b.classList.remove('roll'); void b.offsetWidth; b.classList.add('roll'); } }); },
  async exshare(){ const text = `정밀 분석 결과, "${UI.excuse}"\n${location.origin}${location.pathname}`; try { if (navigator.share) await navigator.share({text}); else { await navigator.clipboard.writeText(text); toast('복사했어요'); } } catch(e){} },
  rename(){ modal(`<div class="h2">이름 바꾸기</div><div class="row" style="margin-top:12px"><input class="f" id="nk" maxlength="12" value="${esc(ME.nickname)}"><button class="btn" data-act="reroll">🎲</button></div><button class="btn pri full" style="margin-top:12px" data-act="dorename">바꾸기</button>`); },
  reroll(){ $('#nk').value = randName(); },
  async dorename(){ try { ME = await rpc('set_nickname', {nick: $('#nk').value.trim()}); closeModal(); toast('바꿨어요'); PZ.meChanged(); render(true); } catch(e){ toast(errMsg(e)); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault(); e.stopPropagation();
  const k = el.dataset.act; LAST = () => ACT[k](el, e); ACT[k](el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ci') $('[data-act=cmt]')?.click(); });

/* ---------------------------------------------------------------- realtime + boot */
(async function boot(){
  try { await Promise.all([loadAssets(), loadMe()]); } catch(e){ $('#app').innerHTML = `<div class="empty">연결하지 못했어요. 새로고침해 주세요</div>`; return; }
  PZ.boot(); render();
  sb.channel('assets').on('postgres_changes', {event:'UPDATE', schema:'public', table:'assets'}, ({ new: r }) => {
    const a = A[r.symbol]; if (!a) return; Object.assign(a, {change_pct: r.change_pct, price: r.price, market_open: r.market_open});
    $$(`[data-c="${CSS.escape(r.symbol)}"]`).forEach(el => { el.textContent = fmtC(a); el.className = 'num ' + dir(pct(a)); });
    if (UI.route === 'room' && UI.room === r.symbol) PZ.enter(r.symbol);
  }).subscribe();
  sb.channel('moods').on('postgres_changes', {event:'INSERT', schema:'public', table:'moods'}, async ({ new: m }) => {
    const { data:au } = await sb.from('profiles').select('nickname,is_bot').eq('id', m.author_id).maybeSingle();
    PZ.onMood(m, au);
    const home = UI.route === 'home', here = UI.route === 'room' && m.symbol === UI.room;
    if (home && !au?.is_bot){ TODAY[m.mood] = (TODAY[m.mood] || 0) + 1; const d = $('#dist'); if (d) d.outerHTML = distHTML(); }
    if (!home && !here) return;
    const feed = $('#feed'); if (!feed || $(`[data-mid="${m.id}"]`)) return;
    feed.querySelector('.empty')?.remove(); feed.insertAdjacentHTML('afterbegin', moodCard({...m, author: au}, null, here));
  }).subscribe();
  setInterval(() => { if (!isTyping() && !$('.modal') && now() - BAG.at > 8000) loadAssets().then(() => {
    if (UI.route === 'home') render(true); else if (UI.route === 'room'){ PZ.enter(UI.room); PZ.load(); $('#hdr').innerHTML = hdrHTML(); } }); }, 60000);
})();
</script>
