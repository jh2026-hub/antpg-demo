<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개미놀이터 데모</title>
<meta name="description" content="실시간 시세가 흐르는 종목방에서 롱/숏을 걸고, 예측 대결·짤·도트로 노는 2D 주식·코인 커뮤니티 데모">
<meta name="theme-color" content="#0f1115">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
:root{--bg:#0f1115;--card:#171a20;--card2:#1f232b;--line:#2a2f39;--text:#e9ebef;--muted:#8a93a3;--up:#f04452;--down:#3b82f6;--gold:#ffd84d;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img.px,canvas.px{image-rendering:pixelated}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom))}
.pix{font-family:'Galmuri11','Galmuri9',monospace;letter-spacing:-.2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.muted{color:var(--muted)}.s{font-size:12.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.wrapf{flex-wrap:wrap}
.top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;height:56px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.logo{font-size:19px;color:var(--gold);flex:1}
.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.h{font-size:15px;margin:0}
.sec{font-size:15px;margin:22px 0 4px;display:flex;align-items:baseline;gap:8px}
.sec .more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#12151a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tabbar a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.tabbar a.on{color:var(--gold)}
.tabbar .ic{font-size:20px;line-height:1.25}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--gold);color:#1a1500;border-color:transparent}
.btn.bu{background:var(--up);color:#fff;border-color:transparent}
.btn.bd{background:var(--down);color:#fff;border-color:transparent}
.btn.full{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{width:100%;min-height:44px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.f:focus{border-color:var(--gold)}
textarea.f{min-height:120px;resize:vertical}
label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.seg button.on.L{background:var(--up);color:#fff}.seg button.on.S{background:var(--down);color:#fff}
.gauge{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--card2);margin:10px 0 6px}
.gauge i{display:block;height:100%}
.gauge .gl{background:var(--up)}.gauge .gs{background:var(--down)}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:10px}
.dots i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.dots i.w{background:var(--gold)}
.big{font-size:30px;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{display:flex;gap:10px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);min-width:0;transition:background .6s}
.tile>div{min-width:0}
.tn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{font-size:13px}
.post{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
.post .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.post .t{font-weight:700;margin:4px 0 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post .foot{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rtag{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--text)}
.stamp{font-family:'Galmuri11',monospace;font-size:11px;font-weight:700;border:2px solid;border-radius:6px;padding:0 5px;transform:rotate(-6deg);display:inline-block;line-height:1.5}
.stamp.LONG{color:var(--up)}.stamp.SHORT{color:var(--down)}
.res{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--card2);white-space:nowrap}
.res.HIT{color:#4ade80}.res.MISS{color:#fca5a5}
.hb{display:inline-flex;gap:3px;align-items:center;font-size:11px;border:1px dashed var(--line);border-radius:6px;padding:0 5px;color:var(--text);white-space:nowrap}
.av{width:22px;height:22px;border-radius:6px;background:var(--card2);vertical-align:middle;flex:none}
.av.lg{width:72px;height:72px;border-radius:14px}
.band{position:sticky;top:56px;z-index:15;margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);transition:background .6s}
.bp{font-size:24px;font-weight:800;line-height:1.2}
.bc{font-size:16px;font-weight:700;text-align:right}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--card2);color:var(--muted);white-space:nowrap}
.tag.live{color:#4ade80}
.stage{margin:12px -16px 0;padding:18px 16px 12px;display:flex;align-items:center;gap:14px;transition:background .6s}
.masc{width:44px;height:44px;flex:none}
.masc.lg{width:96px;height:96px}
.masc.dance{animation:dance .5s ease-in-out infinite alternate}
.masc.cry{animation:cry 1.6s ease-in-out infinite}
.masc.idle{animation:bob 2.2s ease-in-out infinite}
@keyframes dance{0%{transform:rotate(-12deg) translateY(0)}100%{transform:rotate(12deg) translateY(-8px)}}
@keyframes cry{0%,100%{transform:translateX(0) scaleY(1)}10%{transform:translateX(-2px)}20%{transform:translateX(2px)}30%{transform:translateX(0) scaleY(.94)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mwrap{position:relative;flex:none}
.tear{position:absolute;left:30%;top:38%;width:7px;height:10px;background:#7cc4ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;animation:tear 1.2s ease-in infinite}
.tear.r{left:62%;animation-delay:.6s}
@keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(34px)}}
.rxbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.rx{position:relative;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);display:inline-flex;gap:6px;align-items:center;font-size:14px}
.rx.on{border-color:var(--gold);background:#2a2511}
.pop{position:absolute;left:50%;top:0;pointer-events:none;font-size:22px;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(-50%,-56px) scale(1.4);opacity:0}}
.body{white-space:pre-wrap;margin:12px 0}
.body a{color:#7cc4ff;text-decoration:underline}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm.new{animation:flash 1.5s}
@keyframes flash{0%{background:#2a2511}100%{background:transparent}}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;height:52px;padding:0 20px;border-radius:999px;background:var(--gold);color:#1a1500;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);display:flex;align-items:center}
.sortt{display:flex;gap:6px;margin:16px 0 0}
.sortt button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.sortt button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pool{display:flex;height:30px;border-radius:10px;overflow:hidden;margin:10px 0 4px;font-size:12px;font-weight:700}
.pool div{display:flex;align-items:center;padding:0 8px;min-width:0;white-space:nowrap}
.pool .pa{background:#3a1d22;color:#ffb3bb}.pool .pb{background:#16233d;color:#a9c8ff;justify-content:flex-end}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t .r{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#f3f4f6;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.disc{margin:28px 0 8px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.pal button{aspect-ratio:1;min-height:36px;border-radius:8px;border:2px solid transparent}
.pal button.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools .btn.on{border-color:var(--gold);color:var(--gold)}
#pxc{width:100%;max-width:400px;aspect-ratio:1;display:block;margin:10px auto;border-radius:10px;touch-action:none;border:1px solid var(--line)}
#mmc{width:100%;max-width:400px;aspect-ratio:1;display:block;margin:10px auto;border-radius:10px;border:1px solid var(--line)}
.artg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.art img{width:100%;aspect-ratio:1;display:block;background:repeating-conic-gradient(#1c2027 0 25%,#232831 0 50%) 0 0/16px 16px;border-radius:8px}
.art .an{font-size:12.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tpls button{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px}
.tpls button.on{border-color:var(--gold);color:var(--gold)}
.memeimg{width:100%;border-radius:12px;margin:8px 0;display:block}
.pollo{position:relative;display:block;width:100%;text-align:left;min-height:44px;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);overflow:hidden}
.pollo .fill{position:absolute;left:0;top:0;bottom:0;background:#2f2a14;z-index:0}
.pollo span{position:relative;z-index:1}
.pollo.mine{border-color:var(--gold)}
.demo{background:#2a2511;border:1px solid #4a3f12;color:#f3df8a;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:10px 0}
</style>

</div></nav>
<script>
'use strict';
/* ===================== constants ===================== */
const APP = '개미놀이터';
const KEY = 'antpg-demo-v1';
const SETTLE_MS = 60 * 1000;          // demo: long/short scored after 1 minute (spec: 24h)
const RX = [['GAZUA','🚀','가즈아'],['JONBEO','🪨','존버'],['SONJEOL','🔪','손절'],['TODAK','🤝','토닥']];
const BANNED = ['리딩방','수익보장','원금보장','급등주추천','ㅅㅂ','시발'];
const BLOCKED_LINKS = ['open.kakao.com','t.me/','telegram.me','telegram.org'];
const ALLOWED_LINKS = ['news.naver.com','n.news.naver.com','dart.fss.or.kr','kind.krx.co.kr','yna.co.kr','hankyung.com','mk.co.kr','sec.gov','reuters.com','bloomberg.com','coindesk.com'];
const PAL = ['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];
const ROOMS0 = [
  {slug:'btc',name:'비트코인',short:'비트',symbol:'BTCUSDT',market:'CRYPTO',base:98000,chg:1.2,desc:'24시간 안 자는 방. 새벽 털기 주의.',mascot:'a-gold'},
  {slug:'eth',name:'이더리움',short:'이더',symbol:'ETHUSDT',market:'CRYPTO',base:3400,chg:-0.6,desc:'가스비와 함께하는 방',mascot:'a-blue'},
  {slug:'samsung',name:'삼성전자',short:'삼성',symbol:'005930',market:'KR',base:72400,chg:1.1,desc:'국민주 방. 8만 탑승객 환영',mascot:'a-red'},
  {slug:'hynix',name:'SK하이닉스',short:'하닉',symbol:'000660',market:'KR',base:312000,chg:4.2,desc:'HBM 이야기 하는 곳',mascot:'a-red'},
  {slug:'nvda',name:'엔비디아',short:'엔비',symbol:'NVDA',market:'US',base:182.4,chg:-0.8,desc:'GPU 신도 모임',mascot:'a-green'},
  {slug:'tsla',name:'테슬라',short:'테슬라',symbol:'TSLA',market:'US',base:341.2,chg:-3.6,desc:'롤러코스터 탑승장',mascot:'a-blue'},
];
const SYM = {}; ROOMS0.forEach(r => SYM[r.symbol] = r);
const FAKE = {
  '물타기장인':{hit:23,total:31,hold:[['005930',81000]]},
  '역지표인간':{hit:8,total:34,hold:[['TSLA',420]]},
  '떡상기원':{hit:12,total:20,hold:[['BTCUSDT',72000],['000660',180000]]},
  '존버는승리':{hit:5,total:9,hold:[['ETHUSDT',4100]]},
  '손절은과학':{hit:17,total:30,hold:[]},
  '한강뷰예약':{hit:3,total:4,hold:[['NVDA',120]]},
  '코스피5000':{hit:14,total:25,hold:[['005930',58000]]},
  '풀매수개미':{hit:9,total:15,hold:[['000660',290000],['NVDA',140]]},
};
const FAKE_NAMES = Object.keys(FAKE);
const CHAT = ['ㅋㅋㅋ 가즈아','저도 탑승했습니다','이거 맞냐','존버만이 살길','손절 각 재는 중','토닥토닥…','차트 보니까 쌍바닥 같은데','뉴스 떴네요','역지표 형님 등판','오늘 저녁은 라면이다','물 더 탈까 고민 중','평단 공개합니다 ㅠ','개미는 오늘도 웁니다','이 방 분위기 좋네'];

/* ===================== utils ===================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const now = () => Date.now();
const pick = a => a[Math.floor(Math.random() * a.length)];
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ago(t){ const s = (now() - t) / 1000; if (s < 60) return '방금'; if (s < 3600) return Math.floor(s/60) + '분 전'; if (s < 86400) return Math.floor(s/3600) + '시간 전'; return Math.floor(s/86400) + '일 전'; }
function mmss(ms){ if (ms <= 0) return '0:00'; const s = Math.ceil(ms/1000); const m = Math.floor(s/60); return m >= 60 ? Math.floor(m/60) + '시간 ' + (m%60) + '분' : m + ':' + String(s%60).padStart(2,'0'); }
function fmtPrice(sym, p){ if (p == null) return '-'; if (SYM[sym].market === 'KR') return '₩' + Math.round(p).toLocaleString('ko-KR'); return '$' + p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtPct(c){ return (c > 0 ? '+' : '') + c.toFixed(2) + '%'; }
function dir(c){ return c > 0 ? 'up' : c < 0 ? 'down' : 'flat'; }
function shortPrice(sym, p){
  if (SYM[sym].market === 'KR') return p >= 10000 ? (+(p/10000).toFixed(1)) + '만' : Math.round(p) + '원';
  return p >= 1000 ? '$' + (+(p/1000).toFixed(1)) + 'K' : '$' + (+p.toFixed(1));
}
function toast(msg){ const old = $('.toast'); if (old) old.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function isTyping(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function hasBanned(s){ return BANNED.find(w => String(s).includes(w)); }
function hasBlockedLink(s){ return BLOCKED_LINKS.find(w => String(s).toLowerCase().includes(w)); }

/* ===================== pixel art ===================== */
const ANT = [
'................','.....#....#.....','......#..#......','.....######.....','....##o##o##....','....##k##k##....','.....######.....','......####......',
'...#.######.#...','....########....','...#.######.#...','.....######.....','....########....','...#.######.#...','.....#....#.....','................'];
function antPx(body){
  const out = [];
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++){
    const c = ANT[y>>1][x>>1];
    out.push(c === '#' ? body.toString(16) : c === 'o' ? '7' : c === 'k' ? '0' : '.');
  }
  return out.join('');
}
const pxCache = {};
function pxURL(px){
  if (pxCache[px]) return pxCache[px];
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  for (let i = 0; i < 1024; i++){ const ch = px[i]; if (ch === '.') continue; g.fillStyle = PAL[parseInt(ch,16)]; g.fillRect(i%32, i>>5, 1, 1); }
  return pxCache[px] = c.toDataURL();

// Parimutuel: winners split the whole pool pro-rata, floored; leftover points go 1 by 1 to the largest winning stakes.
function payout(entries, win){
  const pool = entries.reduce((a,e) => a + e.amount, 0);
  const winners = entries.filter(e => e.option === win);
  const winSum = winners.reduce((a,e) => a + e.amount, 0);
  if (!winners.length) return [];
  const out = winners.map(e => ({user:e.user, amount:e.amount, pay:Math.floor(e.amount * pool / winSum)}));
  let rem = pool - out.reduce((a,e) => a + e.pay, 0);
  const order = out.slice().sort((x,y) => y.amount - x.amount || (x.user < y.user ? -1 : 1));
  for (let i = 0; rem > 0; i = (i + 1) % order.length, rem--) order[i].pay++;
  return out;
}

    vote(){ if (!need()) return; const p = S.posts.find(x => x.id === id); if (p.poll.my != null) return; const i = +el.dataset.i; p.poll.my = i; p.poll.opts[i].n++; save(); render(true); },

    doreport(){

    enter(){
      if (!need()) return;
      const b = S.bets.find(x => x.id === id), amt = Math.round(+$('#ba').value);
      if (!(amt >= 10 && amt <= 500)) return toast('10~500P 사이로 걸 수 있어요');

      b.entries.push({user:S.me.nick, option:el.dataset.o, amount:amt, at:now()}); addPoints(-amt, `대결 참여 · ${b.question}`); render(true); toast(`${amt}P 걸었어요!`);

    mkbet(){
      if (!need()) return;
      const sym = $('#bs').value, type = $('#bt').value, q = $('#bq').value.trim(), a = $('#bA').value.trim(), bb = $('#bB').value.trim();

    mkroom(){

      if (hasBanned(n + $('#rd').value)) return toast('금칙어가 있어요');

      const sym = $('#rs').value; const slug = 'u' + uid().slice(0, 5);
      S.rooms.push({slug, name:n, short:SYM[sym].short, symbol:sym, market:SYM[sym].market, desc:$('#rd').value.trim() || '개미가 만든 방', official:false, owner:S.me.nick, mascot:$('#rm').value, at:now()});

    checkin(){ if (!need()) return; const d = new Date().toDateString(); if (S.lastCheckin === d) return; S.lastCheckin = d; addPoints(10, '출석'); render(true); toast('출석 +10P'); },
    hold(){ const a = +$('#ha').value; if (!(a > 0)) return toast('평단가를 넣어 주세요'); S.me.holdings.push({sym:$('#hs').value, avg:a}); save(); render(true); },
    unhold(){ S.me.holdings.splice(+el.dataset.i, 1); save(); render(true); },
    reset(){ modal(`<div class="b" style="font-size:17px">데모를 처음 상태로 돌릴까요?</div><div class="muted s" style="margin-top:6px">닉네임·글·포인트가 모두 지워져요.</div><button class="btn bu full" style="margin-top:14px" data-act="doreset">초기화</button><button class="btn full" style="margin-top:8px" data-act="close">취소</button>`); },
    doreset(){ try { localStorage.removeItem(KEY); } catch(e){} location.hash = '#/'; location.reload(); },
    useart(){
      if (!need()) return;
      const a = art(id);
      modal(`<div class="b" style="font-size:17px">"${esc(a.title)}" 어디에 쓸까요?</div><button class="btn full" style="margin-top:12px" data-act="setav" data-id="${id}">내 아바타로</button>
        <div class="muted s" style="margin:14px 0 6px">방 마스코트로 (내가 연 방 또는 데모라 공식 방도 가능)</div>${S.rooms.map(r => `<button class="btn full" style="margin-top:6px" data-act="setmasc" data-id="${id}" data-v="${r.slug}">${esc(r.name)}</button>`).join('')}

    },
    setav(){ S.me.avatar = id; useArt(id); closeModal(); render(true); toast('아바타를 바꿨어요'); },
    setmasc(){ room(v).mascot = id; useArt(id); closeModal(); location.hash = '#/r/' + v; toast('방 마스코트를 바꿨어요'); },
    tool(){ UI.tool = v; $$('[data-act=tool]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); },
    color(){ UI.color = +v; if (UI.tool === 'eraser') UI.tool = 'pen'; $$('[data-act=color]').forEach(b => b.classList.toggle('on', b === el)); $$('[data-act=tool]').forEach(b => b.classList.toggle('on', b.dataset.v === UI.tool)); },
    undo(){ if (PX.undo.length){ PX.data = PX.undo.pop(); pxDraw(); } },
    pxant(){ PX.undo.push(PX.data.slice()); PX.data = Array.from(antPx(UI.color)).map(ch => ch === '.' ? -1 : parseInt(ch,16)); pxDraw(); },
    pxclear(){ PX.undo.push(PX.data.slice()); PX.data = new Array(1024).fill(-1); pxDraw(); },
    pkind(){ UI.pkind = v; $$('[data-act=pkind]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); },
    pxsave(){
      if (!need()) return;
      if (PX.data.every(x => x < 0)) return toast('뭔가 그려 주세요');
      const title = $('#ptitle').value.trim() || '이름 없는 개미'; if (hasBanned(title)) return toast('금칙어가 있어요');
      const a = {id:'u' + uid(), author:S.me.nick, title, kind:UI.pkind || 'AVATAR', px:PX.data.map(x => x < 0 ? '.' : x.toString(16)).join(''), uses:0, at:now()};
      S.arts.push(a); save(); PX.data = new Array(1024).fill(-1); PX.undo = [];
      UI.wsort = 'new'; location.hash = '#/workshop'; toast('공방에 올렸어요. "쓰기"로 아바타·마스코트에 지정해 보세요');
    },
    mtpl(){ UI.mtpl = v; keepMeme(); render(true); },
    mdown(){ const a = document.createElement('a'); a.download = 'antpg-meme.png'; a.href = $('#mmc').toDataURL('image/png'); a.click(); },
    mattach(){
      if (!need()) return;
      S.draftMeme = $('#mmc').toDataURL('image/jpeg', .8); const t = S.memeT.find(x => x.id === UI.mtpl); if (t && t.author !== S.me.nick) t.uses++;
      save(); const slug = UI.backRoom || (S.rooms.find(r => r.symbol === UI.msym) || S.rooms[0]).slug; location.hash = '#/r/' + slug + '/new'; toast('짤을 붙였어요');
    },
    mpub(){
      if (!need()) return;
      const n = ($('#mtn').value || '').trim() || '내 템플릿'; if (hasBanned(n)) return toast('금칙어가 있어요');
      const t = {id:'m' + uid(), author:S.me.nick, title:n, img:UI.upImg, uses:0, at:now()}; S.memeT = S.memeT.filter(x => !x.temp); S.memeT.push(t); UI.mtpl = t.id; UI.upImg = null; save(); keepMeme(); render(true); toast('템플릿을 공개했어요');
    },
  };
  if (A[act]){ e.preventDefault(); A[act](); }
});

/* ===================== pixel editor ===================== */
const PX = {data:new Array(1024).fill(-1), undo:[], down:false};
function pxInit(){
  const cv = $('#pxc'); pxDraw();
  const cell = ev => { const r = cv.getBoundingClientRect(); const x = Math.floor((ev.clientX - r.left) / r.width * 32), y = Math.floor((ev.clientY - r.top) / r.height * 32); return x < 0 || y < 0 || x > 31 || y > 31 ? -1 : y * 32 + x; };
  const paint = i => { if (i < 0) return; const c = UI.tool === 'eraser' ? -1 : UI.color; if (UI.tool === 'fill') return fill(i, c); if (PX.data[i] !== c){ PX.data[i] = c; pxDraw(); } };
  cv.onpointerdown = ev => { ev.preventDefault(); cv.setPointerCapture(ev.pointerId); PX.undo.push(PX.data.slice()); if (PX.undo.length > 50) PX.undo.shift(); PX.down = UI.tool !== 'fill'; paint(cell(ev)); };
  cv.onpointermove = ev => { if (PX.down) paint(cell(ev)); };
  cv.onpointerup = cv.onpointercancel = () => PX.down = false;
}
function fill(i, c){
  const t = PX.data[i]; if (t === c) return; const st = [i];
  while (st.length){ const k = st.pop(); if (PX.data[k] !== t) continue; PX.data[k] = c; const x = k % 32, y = k >> 5; if (x > 0) st.push(k-1); if (x < 31) st.push(k+1); if (y > 0) st.push(k-32); if (y < 31) st.push(k+32); }
  pxDraw();
}
function pxDraw(){
  const cv = $('#pxc'); if (!cv) return; const g = cv.getContext('2d'), s = 11;
  for (let i = 0; i < 1024; i++){ const x = (i % 32) * s, y = (i >> 5) * s; const c = PX.data[i]; g.fillStyle = c < 0 ? (((i % 32) + (i >> 5)) % 2 ? '#1c2027' : '#232831') : PAL[c]; g.fillRect(x, y, s, s); }
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1; g.beginPath();
  for (let k = 0; k <= 32; k++){ g.moveTo(k*s + .5, 0); g.lineTo(k*s + .5, 352); g.moveTo(0, k*s + .5); g.lineTo(352, k*s + .5); } g.stroke();
}

/* ===================== meme ===================== */
const imgCache = {};
function memeInit(){ memeDraw(); }
function loadImg(src){ return imgCache[src] || (imgCache[src] = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; })); }
async function memeDraw(){
  const cv = $('#mmc'); if (!cv) return; const g = cv.getContext('2d'); const W = 600;
  const t = UI.mtpl;
  if (t === 'chart'){
    const sym = UI.msym, a = H[sym], q = Q[sym];
    g.fillStyle = '#0f1115'; g.fillRect(0, 0, W, W);
    g.strokeStyle = 'rgba(255,255,255,.06)'; for (let k = 1; k < 6; k++){ g.beginPath(); g.moveTo(0, k*100); g.lineTo(W, k*100); g.stroke(); }
    const mn = Math.min(...a), mx = Math.max(...a), rg = mx - mn || 1, col = q.changePct >= 0 ? '#f04452' : '#3b82f6';
    g.strokeStyle = col; g.lineWidth = 6; g.lineJoin = 'round'; g.beginPath();
    a.forEach((v,i) => { const x = 20 + i / (a.length - 1) * (W - 40), y = 480 - (v - mn) / rg * 290; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke();
    g.fillStyle = '#e9ebef'; g.font = 'bold 24px Pretendard, sans-serif'; g.textAlign = 'left'; g.fillText(SYM[sym].name + '  ' + fmtPrice(sym, q.price), 24, 150);
    g.fillStyle = col; g.textAlign = 'right'; g.fillText(fmtPct(q.changePct), W - 24, 150);
  } else if (t === 'red' || t === 'blue' || t === 'black'){
    g.fillStyle = {red:'#c81e3a', blue:'#1d4fd8', black:'#050608'}[t]; g.fillRect(0, 0, W, W);
    g.font = '200px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t === 'red' ? '🚀' : t === 'blue' ? '😭' : '🕳', W/2, W/2 + 10); g.textBaseline = 'alphabetic';
  } else {
    const tp = S.memeT.find(x => x.id === t); if (tp){ const im = await loadImg(tp.img); g.drawImage(im, 0, 0, W, W); }
  }
  const t1 = $('#mt1')?.value || '', t2 = $('#mt2')?.value || '';
  memeText(g, t1, 70, false); memeText(g, t2, W - 40, true);
}
function memeText(g, text, y, bottom){
  if (!text) return; const W = 600; g.textAlign = 'center'; g.lineJoin = 'round';
  let size = 54; g.font = `900 ${size}px Pretendard, sans-serif`;
  while (g.measureText(text).width > W - 40 && size > 26){ size -= 2; g.font = `900 ${size}px Pretendard, sans-serif`; }
  const lines = []; let cur = '';
  for (const ch of text){ if (g.measureText(cur + ch).width > W - 40){ lines.push(cur); cur = ch; } else cur += ch; } lines.push(cur);
  const lh = size * 1.15; let y0 = bottom ? y - (lines.length - 1) * lh : y;
  lines.forEach((l, i) => { g.strokeStyle = '#000'; g.lineWidth = size / 6; g.strokeText(l, W/2, y0 + i*lh); g.fillStyle = '#fff'; g.fillText(l, W/2, y0 + i*lh); });
}
function onUpload(f){
  if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast('png·jpg·webp만 올릴 수 있어요');
  if (f.size > 2 * 1024 * 1024) return toast('2MB 이하만 올릴 수 있어요');
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 600; const g = c.getContext('2d');
    const s = Math.max(600 / im.width, 600 / im.height); const w = im.width * s, h = im.height * s; g.drawImage(im, (600 - w)/2, (600 - h)/2, w, h);
    UI.upImg = c.toDataURL('image/jpeg', .82); const id = 'tmp'; imgCache[UI.upImg] = Promise.resolve(c);
    S.memeT = S.memeT.filter(x => x.id !== id); S.memeT.push({id, author:S.me?.nick || '나', title:'방금 올린 이미지', img:UI.upImg, uses:0, at:now(), temp:true});
    UI.mtpl = id; keepMeme(); render(true);
  }; im.src = rd.result; };
  rd.readAsDataURL(f);
}
